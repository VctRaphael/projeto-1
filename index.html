  <!-- Tailwind CSS CDN -->

  <script>
    tailwind.config = {

        extend: {

              900: '#0a0d14',

              800: '#151a28',
              750: '#1b2234',

            neon: {

  <!-- Leaflet JS & React 18 & Babel -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #06070a;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Custom Leaflet Dark Stacking & Radar Effect */
    .leaflet-container {
      background: #07090e !important;
      font-family: 'Rajdhani', sans-serif !important;
    }
    .leaflet-bar a {
      background-color: #0a0d14 !important;
      color: #00f59b !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
    }
    .leaflet-bar a:hover {
      background-color: #151a28 !important;
      color: #fff !important;
    }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: rgba(10, 13, 20, 0.95) !important;
      color: #fff !important;
      border: 1px solid rgba(0, 245, 155, 0.3) !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 245, 155, 0.2) !important;
      backdrop-filter: blur(12px) !important;
      border-radius: 14px !important;
    }
    .leaflet-popup-content {
      margin: 12px 14px !important;
      line-height: 1.4 !important;
    }

    /* Pulse Markers for Radar */
    @keyframes radar-sonar {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 245, 155, 0.8), 0 0 0 0 rgba(0, 245, 155, 0.4);
      }
      70% {
        box-shadow: 0 0 0 25px rgba(0, 245, 155, 0), 0 0 0 45px rgba(0, 245, 155, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 245, 155, 0), 0 0 0 0 rgba(0, 245, 155, 0);
      }
    }
    .pilot-pulse-marker {
      animation: radar-sonar 2s infinite;
      border-radius: 50%;
    }

    @keyframes opponent-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 42, 75, 0.8);
      }
      70% {
        box-shadow: 0 0 0 20px rgba(255, 42, 75, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 42, 75, 0);
      }
    }
    .opponent-pulse-marker {
      animation: opponent-pulse 2.2s infinite;
      border-radius: 50%;
    }

    .glass-panel {
      background: rgba(10, 13, 20, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(15, 19, 29, 0.8);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-modal {
      background: rgba(8, 10, 15, 0.97);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Animação de desafio de racha recebido */
    @keyframes challenge-flash {
      0%, 100% { border-color: rgba(255, 42, 75, 0.9); box-shadow: 0 0 35px rgba(255, 42, 75, 0.6); }
      50% { border-color: rgba(0, 245, 155, 0.9); box-shadow: 0 0 35px rgba(0, 245, 155, 0.6); }
    }
    .challenge-alert-box {
      animation: challenge-flash 1s infinite alternate;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- APLICAÇÃO REACT PRINCIPAL GRIDZONE MULTIPLAYER -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // CÁLCULO DE DISTÂNCIA REAL ENTRE COORDENADAS (HAVERSINE EM METROS/KM)
    // =========================================================================
    function getDistanceBetween(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return "Calculando...";
      const R = 6371; // Raio da Terra em km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distKm = R * c;
      if (distKm < 1) {
        return `${Math.round(distKm * 1000)} metros`;
      }
      return `${distKm.toFixed(1)} km`;
    }

    // =========================================================================
    // SISTEMA DE ÁUDIO SINTÉTICO (EFEITOS SONOROS DE RADAR & SIRENE)
    // =========================================================================
    const SoundFx = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playSonar() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      },
      playChallenge() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.2);
          osc.frequency.linearRampToValueAtTime(440, this.ctx.currentTime + 0.4);
          osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.6);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.8);
        } catch(e) {}
      }
    };

    // =========================================================================
    // COMPONENTE PRINCIPAL GRIDZONE
    // =========================================================================
    function App() {
      // 1. Perfil do Piloto Local (Salvo no LocalStorage do Celular/PC)
      const [myProfile, setMyProfile] = useState(() => {
        const saved = localStorage.getItem("gridzone_pilot_profile");
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return {
          id: "pilot_" + Math.random().toString(36).substring(2, 8),
          name: "Piloto-" + Math.floor(Math.random() * 899 + 100),
          car: "Golf GTI Stage 3",
          power: "380 cv",
          status: "Buscando Puxada / Racha",
          color: "lime"
        };
      });

      // Modais
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [selectedOpponent, setSelectedOpponent] = useState(null);
      const [activeChallengeReceived, setActiveChallengeReceived] = useState(null);
      const [isCreateSpotOpen, setIsCreateSpotOpen] = useState(false);
      const [isAddAlertOpen, setIsAddAlertOpen] = useState(false);

      // Estado de Geolocalização Local
      const [myLocation, setMyLocation] = useState({ lat: -23.5505, lng: -46.6333 });
      const [mySpeed, setMySpeed] = useState(0);
      const [gpsHeading, setGpsHeading] = useState(120);
      const [hasRealGps, setHasRealGps] = useState(false);

      // Dicionário de Pilotos Conectados em Tempo Real (ID -> Objeto do Piloto)
      const [livePilots, setLivePilots] = useState({});

      // Spots e Alertas Públicos
      const [spots, setSpots] = useState([]);
      const [alerts, setAlerts] = useState([]);

      // Status do WebSocket Multiplayer (MQTT)
      const [mqttStatus, setMqttStatus] = useState("Conectando...");
      const mqttClientRef = useRef(null);

      // Toast Notifications
      const [toast, setToast] = useState({ show: false, msg: "" });
      const showToast = (msg) => {
        setToast({ show: true, msg });
        SoundFx.playSonar();
        setTimeout(() => setToast({ show: false, msg: "" }), 3500);
      };

      // Referência do Mapa Leaflet
      const mapInstanceRef = useRef(null);
      const myMarkerRef = useRef(null);
      const pilotMarkersRef = useRef({});

      // -----------------------------------------------------------------------
      // 1. INICIALIZAR GPS REAL DO DISPOSITIVO
      // -----------------------------------------------------------------------
      useEffect(() => {
        if ("geolocation" in navigator) {
          const watchId = navigator.geolocation.watchPosition(
            (pos) => {
              const { latitude, longitude, speed, heading } = pos.coords;
              setMyLocation({ lat: latitude, lng: longitude });
              setMySpeed(speed ? Math.round(speed * 3.6) : 0);
              if (heading) setGpsHeading(Math.round(heading));
              setHasRealGps(true);
            },
            (err) => {
              setHasRealGps(false);
            },
            { enableHighAccuracy: true, maximumAge: 2000, timeout: 12000 }
          );

          return () => navigator.geolocation.clearWatch(watchId);
        }
      }, []);

      // -----------------------------------------------------------------------
      // 2. CONEXÃO MULTIPLAYER EM TEMPO REAL (MQTT OVER WEBSOCKETS LIVRE)
      // -----------------------------------------------------------------------
      useEffect(() => {
        // Conexão via WebSockets público de alta velocidade (EMQX / HiveMQ)
        const brokerUrl = "wss://broker.emqx.io:8084/mqtt";
        const client = mqtt.connect(brokerUrl, {
          clientId: "gz_" + myProfile.id,
          clean: true,
          reconnectPeriod: 3000,
          connectTimeout: 8000
        });

        mqttClientRef.current = client;

        client.on("connect", () => {
          setMqttStatus("Online • Sincronizado");
          
          // Inscreve nos tópicos de localização de todos os pilotos e desafios
          client.subscribe("gridzone/pilots/#");
          client.subscribe(`gridzone/challenges/${myProfile.id}`);
          client.subscribe("gridzone/spots");
          client.subscribe("gridzone/alerts");
        });

        client.on("reconnect", () => setMqttStatus("Reconectando..."));
        client.on("error", () => setMqttStatus("Offline (Modo Local)"));

        // Recebimento de Mensagens em Tempo Real de Outros Celulares / PCs
        client.on("message", (topic, message) => {
          try {
            const data = JSON.parse(message.toString());

            // A. Atualização de Localização de Outro Piloto
            if (topic.startsWith("gridzone/pilots/")) {
              const pilotId = topic.replace("gridzone/pilots/", "");
              if (pilotId !== myProfile.id) {
                setLivePilots(prev => ({
                  ...prev,
                  [pilotId]: { ...data, lastSeen: Date.now() }
                }));
              }
            }

            // B. Desafio de Racha Recebido Diretamente por Você!
            if (topic === `gridzone/challenges/${myProfile.id}`) {
              setActiveChallengeReceived(data);
              SoundFx.playChallenge();
              if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
            }

            // C. Novo Ponto de Racha Marcado
            if (topic === "gridzone/spots") {
              setSpots(prev => [data, ...prev.filter(s => s.id !== data.id)]);
              showToast(`🏁 Novo Ponto: "${data.title}" marcado no mapa!`);
            }

            // D. Novo Alerta de Polícia / Radar
            if (topic === "gridzone/alerts") {
              setAlerts(prev => [data, ...prev.filter(a => a.id !== data.id)]);
              SoundFx.playChallenge();
              showToast(`🚨 Alerta: "${data.title}" reportado perto de você!`);
            }
          } catch(e) {}
        });

        return () => {
          if (client) client.end();
        };
      }, [myProfile.id]);

      // -----------------------------------------------------------------------
      // 3. BROADCAST PERIÓDICO DA SUA LOCALIZAÇÃO PARA OS ADVERSÁRIOS
      // -----------------------------------------------------------------------
      useEffect(() => {
        const broadcastLocation = () => {
          const client = mqttClientRef.current;
          if (client && client.connected) {
            const payload = {
              id: myProfile.id,
              name: myProfile.name,
              car: myProfile.car,
              power: myProfile.power,
              status: myProfile.status,
              color: myProfile.color,
              lat: myLocation.lat,
              lng: myLocation.lng,
              speed: mySpeed,
              heading: gpsHeading,
              timestamp: Date.now()
            };
            client.publish(`gridzone/pilots/${myProfile.id}`, JSON.stringify(payload));
          }
        };

        // Envia imediatamente e a cada 3 segundos
        broadcastLocation();
        const interval = setInterval(broadcastLocation, 3500);

        return () => clearInterval(interval);
      }, [myLocation, mySpeed, gpsHeading, myProfile]);

      // -----------------------------------------------------------------------
      // 4. MAPA LEAFLET COM CARTODB DARK TILES
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (!mapInstanceRef.current) {
          const map = L.map("radar-map", {
            center: [myLocation.lat, myLocation.lng],
            zoom: 14,
            zoomControl: false,
            attributionControl: false
          });

          L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
            maxZoom: 19,
            subdomains: "abcd"
          }).addTo(map);

          L.control.zoom({ position: "bottomright" }).addTo(map);
          mapInstanceRef.current = map;
        }

        renderMarkers();
      }, [myLocation, livePilots, spots, alerts]);

      // Renderização dinâmica dos marcadores
      const renderMarkers = () => {
        const map = mapInstanceRef.current;
        if (!map) return;

        // Marcador do Seu Veículo (Verde Neon)
        const myIcon = L.divIcon({
          className: "my-marker",
          html: `
            <div class="relative flex items-center justify-center">
              <div class="w-14 h-14 bg-neon-lime/25 rounded-full pilot-pulse-marker absolute"></div>
              <div class="w-9 h-9 bg-carbon-950 border-2 border-neon-lime rounded-full flex items-center justify-center shadow-neon-lime z-10 text-white font-black text-sm">
                🏎️
              </div>
              <div class="absolute -bottom-6 px-2 py-0.5 rounded bg-carbon-900 border border-neon-lime text-[10px] font-mono font-bold text-neon-lime whitespace-nowrap shadow-lg">
                ${myProfile.name} • ${myProfile.car}
              </div>
            </div>
          `,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        if (!myMarkerRef.current) {
          myMarkerRef.current = L.marker([myLocation.lat, myLocation.lng], { icon: myIcon }).addTo(map);
        } else {
          myMarkerRef.current.setLatLng([myLocation.lat, myLocation.lng]);
          myMarkerRef.current.setIcon(myIcon);
        }

        // Marcadores de Outros Pilotos Conectados em Tempo Real
        Object.values(livePilots).forEach(pilot => {
          // Filtra pilotos desconectados há mais de 2 minutos
          if (Date.now() - pilot.lastSeen > 120000) return;

          const opponentIcon = L.divIcon({
            className: "opponent-marker",
            html: `
              <div class="relative flex items-center justify-center cursor-pointer">
                <div class="w-12 h-12 bg-neon-red/30 rounded-full opponent-pulse-marker absolute"></div>
                <div class="w-8 h-8 bg-carbon-900 border-2 border-neon-red rounded-full flex items-center justify-center shadow-neon-red text-white text-xs font-bold">
                  ⚡
                </div>
                <div class="absolute -bottom-6 px-2 py-0.5 rounded bg-carbon-950 border border-neon-red/60 text-[9px] font-mono font-bold text-white whitespace-nowrap shadow-lg">
                  ${pilot.name} • <span class="text-neon-red">${pilot.car}</span>
                </div>
              </div>
            `,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });

          if (!pilotMarkersRef.current[pilot.id]) {
            const marker = L.marker([pilot.lat, pilot.lng], { icon: opponentIcon }).addTo(map);
            marker.on("click", () => {
              setSelectedOpponent(pilot);
              SoundFx.playSonar();
            });
            pilotMarkersRef.current[pilot.id] = marker;
          } else {
            pilotMarkersRef.current[pilot.id].setLatLng([pilot.lat, pilot.lng]);
          }
        });
      };

      // Salvar Perfil do Piloto
      const handleSaveProfile = (e) => {
        e.preventDefault();
        const form = e.target;
        const updated = {
          ...myProfile,
          name: form.name.value.trim() || "Piloto Anônimo",
          car: form.car.value.trim() || "Carro Preparado",
          power: form.power.value.trim() || "300 cv",
          status: form.status.value
        };
        setMyProfile(updated);
        localStorage.setItem("gridzone_pilot_profile", JSON.stringify(updated));
        setIsProfileModalOpen(false);
        showToast("Ficha do Piloto & Carro atualizada no Radar!");
      };

      // Disparar Desafio de Racha para o Adversário Selecionado
      const handleChallengeOpponent = (opponent) => {
        const client = mqttClientRef.current;
        if (client && client.connected) {
          const payload = {
            challengerId: myProfile.id,
            challengerName: myProfile.name,
            challengerCar: myProfile.car,
            challengerPower: myProfile.power,
            challengerLocation: myLocation,
            timestamp: Date.now()
          };
          client.publish(`gridzone/challenges/${opponent.id}`, JSON.stringify(payload));
          showToast(`⚡ Desafio de racha enviado para ${opponent.name}!`);
          setSelectedOpponent(null);
        } else {
          showToast("Conexão instável. Tente novamente.");
        }
      };

      // Aceitar Desafio
      const handleAcceptChallenge = () => {
        showToast(`🏁 Desafio aceito! Encontre ${activeChallengeReceived.challengerName} no ponto de partida!`);
        if (mapInstanceRef.current && activeChallengeReceived.challengerLocation) {
          mapInstanceRef.current.panTo([
            activeChallengeReceived.challengerLocation.lat,
            activeChallengeReceived.challengerLocation.lng
          ], { animate: true });
        }
        setActiveChallengeReceived(null);
      };

      const activePilotsCount = Object.keys(livePilots).length + 1;

      return (
        <div className="h-screen w-screen flex flex-col bg-carbon-950 text-gray-100 overflow-hidden select-none">
          
          {/* TOAST FLUTUANTE */}
          {toast.show && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-5 py-3 rounded-2xl glass-modal border border-neon-lime text-white font-mono text-xs font-bold shadow-neon-lime flex items-center gap-3 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-neon-lime glow-line-green"></span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* ===================================================================
              TOPBAR: LOGO, PERFIL DO PILOTO & STATUS DA CONEXÃO REALTIME
             =================================================================== */}
          <header className="h-16 glass-panel border-b border-white/10 px-4 sm:px-6 flex items-center justify-between z-30 shrink-0">
            
            {/* Logo Oficial GridZone */}
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setIsProfileModalOpen(true)}>
              <div className="relative w-11 h-11 rounded-xl overflow-hidden border border-neon-lime/40 shadow-neon-lime flex items-center justify-center bg-carbon-900 shrink-0">
                <img src="logo.jpg" alt="GridZone Logo" className="w-full h-full object-cover" />
              </div>

              <div>
                <div className="flex items-center gap-2">
                  <span className="font-racing font-black text-xl sm:text-2xl tracking-wider text-white">
                    GRID<span className="text-neon-lime">ZONE</span>
                  </span>
                  <span className="px-1.5 py-0.5 rounded bg-neon-lime/10 text-neon-lime border border-neon-lime/30 text-[9px] font-mono font-bold tracking-widest uppercase">
                    WAZE LIVE
                  </span>
                </div>
                <div className="text-[10px] font-mono text-gray-400 hidden sm:block -mt-1">
                  Radar GPS em Tempo Real • Encontros & Rachas
                </div>
              </div>
            </div>

            {/* Ficha Rápida do Piloto (Clique para Editar Carro e Nome) */}
            <div className="flex items-center gap-2 sm:gap-3">
              
              <button 
                onClick={() => setIsProfileModalOpen(true)}
                className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-carbon-900 hover:bg-carbon-800 border border-white/10 hover:border-neon-lime transition-all text-left"
              >
                <div className="w-3 h-3 rounded-full bg-neon-lime glow-line-green"></div>
                <div>
                  <div className="text-xs font-bold text-white leading-none flex items-center gap-1.5">
                    <span>{myProfile.name}</span>
                    <span className="text-[10px] font-mono text-neon-lime font-bold">({myProfile.power})</span>
                  </div>
                  <div className="text-[10px] font-mono text-gray-400 truncate max-w-[130px] sm:max-w-[180px]">
                    {myProfile.car}
                  </div>
                </div>
                <span className="text-gray-500 text-xs ml-1">✏️</span>
              </button>

              {/* Status Realtime */}
              <div className="hidden md:flex items-center gap-2 px-3 py-2 rounded-xl bg-carbon-900 border border-white/10 text-xs font-mono">
                <span className="w-2 h-2 rounded-full bg-neon-lime animate-ping"></span>
                <span className="text-gray-300">{activePilotsCount} Pilotos no Radar</span>
              </div>

            </div>

          </header>

          {/* ===================================================================
              MAPA FULLSCREEN EM TEMPO REAL (LEAFLET + CARTODB DARK)
             =================================================================== */}
          <div className="relative flex-1 w-full h-[calc(100vh-64px)] overflow-hidden">
            
            {/* Container do Mapa */}
            <div id="radar-map" className="w-full h-full z-0"></div>

            {/* OVERLAY: HUD DE TELEMETRIA AO VIVO DO SEU CARRO */}
            <div className="absolute top-4 left-4 z-20 flex items-center gap-3 p-3 rounded-2xl glass-modal border border-white/10 shadow-2xl pointer-events-auto">
              <div className="text-center min-w-[70px]">
                <div className="text-[10px] font-mono text-gray-400">VELOCIDADE</div>
                <div className="text-3xl font-black font-racing text-neon-lime leading-tight">
                  {mySpeed}
                </div>
                <div className="text-[10px] font-mono text-gray-300">KM/H</div>
              </div>

              <div className="w-px h-10 bg-white/10"></div>

              <div className="text-xs font-mono text-gray-300 space-y-0.5">
                <div className="flex items-center gap-1.5">
                  <span className="text-gray-500">PROA:</span>
                  <span className="text-neon-cyan font-bold">{gpsHeading}°</span>
                </div>
                <div className="flex items-center gap-1.5">
                  <span className="text-gray-500">GPS:</span>
                  <span className={`font-bold ${hasRealGps ? 'text-neon-lime' : 'text-amber-400'}`}>
                    {hasRealGps ? 'PRECISO (SATELLITE FIX)' : 'SIMULADO'}
                  </span>
                </div>
              </div>
            </div>

            {/* BOTÃO FLUTUANTE CENTRALIZAR NO SEU CARRO */}
            <button 
              onClick={() => {
                if (mapInstanceRef.current) {
                  mapInstanceRef.current.panTo([myLocation.lat, myLocation.lng], { animate: true });
                  showToast("Câmera centralizada no seu veículo!");
                }
              }}
              className="absolute top-4 right-4 z-20 px-3.5 py-2.5 rounded-2xl glass-modal border border-white/15 text-xs font-mono font-bold text-white flex items-center gap-2 hover:border-neon-lime transition-all shadow-xl"
            >
              <span>🎯</span>
              <span className="hidden sm:inline">CENTRALIZAR GPS</span>
            </button>

            {/* OVERLAY: BARRA DE AÇÕES INFERIOR NO MAPA */}
            <div className="absolute bottom-6 left-4 right-4 z-20 flex flex-wrap items-center justify-between gap-3 pointer-events-none">
              
              <div className="pointer-events-auto flex items-center gap-2">
                <button 
                  onClick={() => setIsProfileModalOpen(true)}
                  className="px-4 py-3 rounded-2xl bg-carbon-900/90 hover:bg-carbon-800 border border-white/15 text-white font-mono text-xs font-bold shadow-xl flex items-center gap-2 backdrop-blur-md"
                >
                  <span>🏎️</span>
                  <span>TROCAR MEU CARRO</span>
                </button>
              </div>

              <div className="pointer-events-auto flex items-center gap-2">
                {/* Botão Marcar Ponto / Encontro */}
                <button 
                  onClick={() => setIsCreateSpotOpen(true)}
                  className="px-4 py-3 rounded-2xl bg-gradient-to-r from-neon-lime to-emerald-500 text-carbon-950 font-black text-xs font-mono tracking-wider shadow-neon-lime flex items-center gap-2 hover:scale-105 transition-all"
                >
                  <span>🏁</span>
                  <span>MARCAR PONTO / RETAS</span>
                </button>

                {/* Botão Alertar Radar / Polícia */}
                <button 
                  onClick={() => setIsAddAlertOpen(true)}
                  className="px-4 py-3 rounded-2xl bg-gradient-to-r from-neon-red to-rose-600 text-white font-black text-xs font-mono tracking-wider shadow-neon-red flex items-center gap-2 hover:scale-105 transition-all"
                >
                  <span>🚨</span>
                  <span>AVISAR POLÍCIA</span>
                </button>
              </div>

            </div>

          </div>

          {/* ===================================================================
              MODAL 1: FICHA DE IDENTIFICAÇÃO DO PILOTO & CARRO
             =================================================================== */}
          {isProfileModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-neon-lime/40 shadow-neon-lime space-y-4">
                
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">🏎️</span>
                    <div>
                      <h3 className="font-racing font-bold text-lg text-white">Identificação no Radar</h3>
                      <p className="text-[11px] text-gray-400">Configure seu nome e qual carro você está dirigindo</p>
                    </div>
                  </div>
                  <button onClick={() => setIsProfileModalOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={handleSaveProfile} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Seu Nome / Apelido de Piloto</label>
                    <input 
                      name="name" 
                      defaultValue={myProfile.name} 
                      required 
                      placeholder="Ex: Victor Turbo, Viper-01, Lucas" 
                      className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-neon-lime" 
                    />
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Carro que Você Está Dirigindo Agora</label>
                    <input 
                      name="car" 
                      defaultValue={myProfile.car} 
                      required 
                      placeholder="Ex: Golf GTI Stage 3, BMW M2, Civic Si K24" 
                      className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-neon-lime" 
                    />
                    <span className="text-[10px] text-gray-500 font-mono mt-1 block">
                      Os outros pilotos verão esse modelo no mapa para saber quem estão enfrentando!
                    </span>
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Potência Estimada (cv)</label>
                    <input 
                      name="power" 
                      defaultValue={myProfile.power} 
                      required 
                      placeholder="Ex: 380 cv, 560 cv, 220 cv" 
                      className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-neon-lime" 
                    />
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Status de Desafio no Radar</label>
                    <select name="status" defaultValue={myProfile.status} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-neon-lime">
                      <option>Buscando Puxada / Racha</option>
                      <option>Desafio Aberto (Qualquer Carro)</option>
                      <option>Apenas no Rolê / Cruise Noturno</option>
                      <option>Parado no Posto de Encontro</option>
                    </select>
                  </div>

                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsProfileModalOpen(false)} className="px-4 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Salvar no Radar</button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL 2: FICHA DO ADVERSÁRIO CLICADO NO MAPA (COMBAT SHEET)
             =================================================================== */}
          {selectedOpponent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-neon-red/50 shadow-neon-red space-y-4">
                
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">⚔️</span>
                    <div>
                      <h3 className="font-racing font-bold text-lg text-white">Adversário no Radar</h3>
                      <p className="text-[11px] text-neon-red font-mono font-bold">PILOTO REAL DETECTADO</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedOpponent(null)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <div className="p-4 rounded-2xl bg-carbon-900 border border-white/10 space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-xs font-mono text-gray-400">PILOTO</div>
                      <div className="text-xl font-bold text-white">{selectedOpponent.name}</div>
                    </div>
                    <span className="px-2.5 py-1 rounded-full text-[10px] font-mono font-bold bg-neon-red/20 text-neon-red border border-neon-red/40">
                      {selectedOpponent.status}
                    </span>
                  </div>

                  <div className="border-t border-white/5 pt-3">
                    <div className="text-xs font-mono text-gray-400">VEÍCULO / PREPARAÇÃO</div>
                    <div className="text-lg font-racing font-black text-white mt-0.5">{selectedOpponent.car}</div>
                    <div className="text-sm font-racing font-bold text-neon-lime mt-1">{selectedOpponent.power}</div>
                  </div>

                  <div className="border-t border-white/5 pt-3 flex justify-between text-xs font-mono">
                    <div>
                      <span className="text-gray-400">Velocidade Atual:</span>
                      <div className="font-bold text-white">{selectedOpponent.speed} km/h</div>
                    </div>
                    <div className="text-right">
                      <span className="text-gray-400">Distância de Você:</span>
                      <div className="font-bold text-neon-cyan">
                        {getDistanceBetween(myLocation.lat, myLocation.lng, selectedOpponent.lat, selectedOpponent.lng)}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Botão Gigante de Desafio */}
                <button 
                  onClick={() => handleChallengeOpponent(selectedOpponent)}
                  className="w-full py-4 rounded-2xl bg-gradient-to-r from-neon-red to-rose-600 hover:from-rose-500 hover:to-neon-red text-white font-racing font-black text-sm uppercase tracking-wider shadow-neon-red transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2"
                >
                  <span>⚡</span>
                  <span>DESAFIAR PARA PUXADA / RACHA</span>
                </button>

              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL 3: ALERTA DE DESAFIO DE RACHA RECEBIDO EM TEMPO REAL!
             =================================================================== */}
          {activeChallengeReceived && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border-2 border-neon-red shadow-2xl challenge-alert-box space-y-4">
                
                <div className="text-center space-y-2">
                  <div className="w-16 h-16 rounded-full bg-neon-red/25 border-2 border-neon-red mx-auto flex items-center justify-center text-3xl animate-bounce">
                    🚨
                  </div>
                  <h3 className="font-racing font-black text-2xl text-neon-red">DESAFIO DE RACHA RECEBIDO!</h3>
                  <p className="text-xs text-gray-300 font-mono">Um piloto próximo quer puxar com você agora!</p>
                </div>

                <div className="p-4 rounded-2xl bg-carbon-900 border border-white/10 space-y-2 text-center">
                  <div className="text-xs font-mono text-gray-400">DESAFIANTE:</div>
                  <div className="text-xl font-bold text-white">{activeChallengeReceived.challengerName}</div>
                  <div className="text-base font-racing font-bold text-neon-lime">{activeChallengeReceived.challengerCar}</div>
                  <div className="text-xs font-mono text-gray-300">Potência declarada: {activeChallengeReceived.challengerPower}</div>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button 
                    onClick={() => setActiveChallengeReceived(null)}
                    className="py-3.5 rounded-xl bg-carbon-800 text-gray-400 hover:text-white font-mono font-bold text-xs"
                  >
                    Recusar
                  </button>
                  <button 
                    onClick={handleAcceptChallenge}
                    className="py-3.5 rounded-xl bg-gradient-to-r from-neon-lime to-emerald-500 text-carbon-950 font-racing font-black text-xs uppercase tracking-wider shadow-neon-lime"
                  >
                    🔥 ACEITAR DESAFIO
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL 4: MARCAR PONTO DE ENCONTRO / RETAS
             =================================================================== */}
          {isCreateSpotOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-neon-lime/40 shadow-neon-lime space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🏁</span>
                    <h3 className="font-racing font-bold text-lg text-white">Marcar Ponto de Encontro / Racha</h3>
                  </div>
                  <button onClick={() => setIsCreateSpotOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newSpot = {
                    id: "spot_" + Date.now(),
                    title: form.title.value,
                    lat: myLocation.lat + (Math.random() - 0.5) * 0.004,
                    lng: myLocation.lng + (Math.random() - 0.5) * 0.004,
                    creator: myProfile.name,
                    time: "Ativo Agora"
                  };
                  if (mqttClientRef.current && mqttClientRef.current.connected) {
                    mqttClientRef.current.publish("gridzone/spots", JSON.stringify(newSpot));
                  }
                  setIsCreateSpotOpen(false);
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Nome do Ponto / Reta</label>
                    <input name="title" required placeholder="Ex: Reta do Aeroporto, Posto Shell Podium" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-neon-lime" />
                  </div>
                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsCreateSpotOpen(false)} className="px-4 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Transmitir no Radar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL 5: ALERTAR POLÍCIA / BLITZ NO RADAR
             =================================================================== */}
          {isAddAlertOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-neon-red/40 shadow-neon-red space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🚨</span>
                    <h3 className="font-racing font-bold text-lg text-white">Alertar Radar Móvel ou Polícia</h3>
                  </div>
                  <button onClick={() => setIsAddAlertOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newAlert = {
                    id: "alert_" + Date.now(),
                    title: form.title.value,
                    lat: myLocation.lat + (Math.random() - 0.5) * 0.003,
                    lng: myLocation.lng + (Math.random() - 0.5) * 0.003,
                    reporter: myProfile.name,
                    time: "agora mesmo"
                  };
                  if (mqttClientRef.current && mqttClientRef.current.connected) {
                    mqttClientRef.current.publish("gridzone/alerts", JSON.stringify(newAlert));
                  }
                  setIsAddAlertOpen(false);
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Descrição do Radar ou Viatura</label>
                    <input name="title" required placeholder="Ex: Radar móvel sob o viaduto, viatura parada" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-neon-red" />
                  </div>
                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsAddAlertOpen(false)} className="px-4 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-neon-red text-white font-black font-racing shadow-neon-red">Emitir Alerta Imediato</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderizar na DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
