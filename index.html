<body>

  <!-- APLICAÇÃO REACT PRINCIPAL GRIDZONE -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // SOM / EFEITOS SONOROS WEBAUDIO (SEM DEPENDÊNCIAS EXTERNAS)
    // =========================================================================
    const SoundFx = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playPing() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch(e) {}
      },
      playAlert() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc.frequency.setValueAtTime(740, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      }
    };

    // =========================================================================
    // DADOS MOCKADOS INICIAIS DO RADAR (PILOTOS PRÓXIMOS, SPOTS, ALERTAS)
    // =========================================================================
    // Coordenadas centrais padrão (São Paulo - Rod. dos Imigrantes / Marginal / Interlagos)
    const DEFAULT_COORDS = { lat: -23.5505, lng: -46.6333 };

    const INITIAL_PILOTS = [
      {

      },
      {

        lat: -23.5560,

        speed: 112,

        avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80"
      },
      {

        speed: 65,

        statusColor: "cyan",
        callsign: "Redline-Si",
        avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80"
      },
      {
        id: "pilot-4",
        name: "Thiago Track",
        car: "Golf R Mk8 Stage 3 (480cv)",
        lat: -23.5590,
        lng: -46.6420,
        speed: 0,
        status: "Parado no Posto",
        statusColor: "amber",
        callsign: "Haldex-99",
        avatar: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=120&q=80"
      }
    ];

    const INITIAL_SPOTS = [
      {
        id: "spot-1",
        title: "Reta do Aeroporto / Racha Seguro",
        category: "Ponto de Encontro / Puxada",
        lat: -23.5520,
        lng: -46.6450,
        carsCount: 8,
        desc: "Asfalto novo e duplicado, reta longa de 1.200m com ampla visão.",
        time: "Ativo agora (23h às 03h)",
        verified: true
      },
      {
        id: "spot-2",
        title: "Posto Shell Podium 24h",
        category: "Concentração & Abastecimento",
        lat: -23.5410,
        lng: -46.6260,
        carsCount: 14,
        desc: "Ponto de encontro oficial do comboio. Conveniência aberta e calibrador.",
        time: "Concentração 22:30",
        verified: true
      }
    ];

    const INITIAL_ALERTS = [
      {
        id: "alert-1",
        type: "police",
        title: "Radar Móvel / Fiscalização",
        lat: -23.5540,
        lng: -46.6350,
        desc: "Viatura com radar móvel sob o viaduto. Diminuam a velocidade!",
        reporter: "Viper-01",
        time: "há 4 min"
      },
      {
        id: "alert-2",
        type: "hazard",
        title: "Óleo na Pista na Curva 3",
        lat: -23.5460,
        lng: -46.6400,
        desc: "Mancha de fluido recente na faixa da direita. Cuidado!",
        reporter: "Quattro-X",
        time: "há 12 min"
      }
    ];

    const INITIAL_RADIO_CHAT = [
      { id: 1, user: "Renato (M2)", callsign: "Viper-01", text: "Alguém no Posto Shell? Chegando em 5 minutos com a M2!", time: "23:14" },
      { id: 2, user: "Guilherme (RS3)", callsign: "Quattro-X", text: "Já estamos em 6 carros aqui. Gasolina Podium abastecida, vamos subir a serra!", time: "23:16" },
      { id: 3, user: "Diego (Civic)", callsign: "Redline-Si", text: "Cuidado na alça de acesso, tem viatura parada no acostamento avisada no radar!", time: "23:18" }
    ];

    // =========================================================================
    // COMPONENTE PRINCIPAL GRIDZONE
    // =========================================================================
    function App() {
      // Aba Ativa (Radar é o destaque principal!)
      const [activeTab, setActiveTab] = useState("radar"); // radar, garage, costs, feed

      // Estado de Geolocalização
      const [userLocation, setUserLocation] = useState(DEFAULT_COORDS);
      const [userSpeed, setUserSpeed] = useState(0);
      const [gpsHeading, setGpsHeading] = useState(140);
      const [gpsAccuracy, setGpsAccuracy] = useState(4);
      const [isGpsActive, setIsGpsActive] = useState(false);
      const [isTrackingLocked, setIsTrackingLocked] = useState(true);

      // Dados do Radar
      const [pilots, setPilots] = useState(INITIAL_PILOTS);
      const [spots, setSpots] = useState(INITIAL_SPOTS);
      const [alerts, setAlerts] = useState(INITIAL_ALERTS);
      const [radioChat, setRadioChat] = useState(INITIAL_RADIO_CHAT);
      const [radioMessage, setRadioMessage] = useState("");

      // Modais
      const [isCreateSpotOpen, setIsCreateSpotOpen] = useState(false);
      const [isAddAlertOpen, setIsAddAlertOpen] = useState(false);
      const [isRadioOpen, setIsRadioOpen] = useState(false);
      const [soundMuted, setSoundMuted] = useState(false);

      // Toast
      const [toast, setToast] = useState({ show: false, msg: "" });
      const showToast = (msg) => {
        setToast({ show: true, msg });
        SoundFx.playPing();
        setTimeout(() => setToast({ show: false, msg: "" }), 3500);
      };

      // Referência do Mapa Leaflet
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const userMarkerRef = useRef(null);
      const otherMarkersRef = useRef({});

      // -----------------------------------------------------------------------
      // 1. INICIALIZAR GEOLOCALIZAÇÃO REAL DO NAVEGADOR
      // -----------------------------------------------------------------------
      useEffect(() => {
        if ("geolocation" in navigator) {
          const watchId = navigator.geolocation.watchPosition(
            (pos) => {
              const { latitude, longitude, speed, heading, accuracy } = pos.coords;
              setUserLocation({ lat: latitude, lng: longitude });
              setUserSpeed(speed ? Math.round(speed * 3.6) : Math.floor(Math.random() * 25 + 45));
              if (heading) setGpsHeading(Math.round(heading));
              if (accuracy) setGpsAccuracy(Math.round(accuracy));
              setIsGpsActive(true);
            },
            (err) => {
              // Se permissão negada, ativa simulação para funcionar sempre
              setIsGpsActive(false);
            },
            { enableHighAccuracy: true, maximumAge: 1500, timeout: 10000 }
          );

          return () => navigator.geolocation.clearWatch(watchId);
        }
      }, []);

      // Simulação de movimento contínuo caso GPS parado (efeito imersivo de telemetria)
      useEffect(() => {
        const interval = setInterval(() => {
          // Atualiza velocidade mockada dinamicamente entre 60 e 115 km/h
          setUserSpeed(prev => {
            const delta = Math.floor(Math.random() * 7) - 3;
            const newSpeed = Math.max(50, Math.min(135, (prev || 75) + delta));
            return newSpeed;
          });

          // Move ligeiramente os outros pilotos próximos simulando tráfego real
          setPilots(prev => prev.map(p => ({
            ...p,
            lat: p.lat + (Math.random() - 0.5) * 0.0004,
            lng: p.lng + (Math.random() - 0.5) * 0.0004,
            speed: Math.max(0, p.speed + Math.floor(Math.random() * 5 - 2))
          })));
        }, 3000);

        return () => clearInterval(interval);
      }, []);

      // -----------------------------------------------------------------------
      // 2. INICIALIZAR MAPA LEAFLET COM CARTODB DARK TILES
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (activeTab !== "radar") return;

        // Aguarda container estar pronto
        const timer = setTimeout(() => {
          const container = document.getElementById("radar-map");
          if (!container) return;

          if (!mapInstanceRef.current) {
            const map = L.map("radar-map", {
              center: [userLocation.lat, userLocation.lng],
              zoom: 14,
              zoomControl: false,
              attributionControl: false
            });

            // Camada de Mapa Noturno de Alta Velocidade (CartoDB Dark Matter)
            L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
              maxZoom: 19,
              subdomains: "abcd"
            }).addTo(map);

            // Adiciona controle de zoom na direita inferior
            L.control.zoom({ position: "bottomright" }).addTo(map);

            mapInstanceRef.current = map;
          } else {
            mapInstanceRef.current.invalidateSize();
          }

          renderMapLayers();
        }, 150);

        return () => clearTimeout(timer);
      }, [activeTab]);

      // -----------------------------------------------------------------------
      // 3. ATUALIZAR MARCADORES NO MAPA (PILOTO PRINCIPAL, AMIGOS, SPOTS, ALERTAS)
      // -----------------------------------------------------------------------
      const renderMapLayers = () => {
        const map = mapInstanceRef.current;
        if (!map) return;

        // A. Marcador do Piloto Atual (Você)
        const userIcon = L.divIcon({
          className: "user-radar-pin",
          html: `
            <div class="relative flex items-center justify-center">
              <div class="w-12 h-12 bg-neon-lime/25 rounded-full pilot-pulse-marker absolute"></div>
              <div class="w-8 h-8 bg-carbon-950 border-2 border-neon-lime rounded-full flex items-center justify-center shadow-neon-lime z-10 text-white font-black text-xs">
                🏎️
              </div>
              <div class="absolute -bottom-6 px-2 py-0.5 rounded bg-carbon-900 border border-neon-lime/40 text-[10px] font-mono font-bold text-neon-lime whitespace-nowrap shadow-lg">
                VOCÊ • ${userSpeed} km/h
              </div>
            </div>
          `,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        if (!userMarkerRef.current) {
          userMarkerRef.current = L.marker([userLocation.lat, userLocation.lng], { icon: userIcon }).addTo(map);
          userMarkerRef.current.bindPopup(`
            <div class="p-1 text-xs">
              <div class="font-racing font-bold text-neon-lime text-sm">SEU VEÍCULO</div>
              <div class="text-gray-300 font-mono mt-1">BMW M2 G87 Stage 2</div>
              <div class="text-xs text-white font-bold mt-1">Velocidade: ${userSpeed} km/h</div>
              <div class="text-[10px] text-gray-400 font-mono mt-1">GPS Fix: 3D • Heading ${gpsHeading}°</div>
            </div>
          `);
        } else {
          userMarkerRef.current.setLatLng([userLocation.lat, userLocation.lng]);
          userMarkerRef.current.setIcon(userIcon);
        }

        if (isTrackingLocked) {
          map.panTo([userLocation.lat, userLocation.lng], { animate: true, duration: 1 });
        }

        // B. Marcadores dos Outros Pilotos
        pilots.forEach(pilot => {
          const pilotIcon = L.divIcon({
            className: "other-pilot-pin",
            html: `
              <div class="relative flex items-center justify-center">
                <div class="w-7 h-7 bg-carbon-900 border-2 border-neon-cyan rounded-full flex items-center justify-center shadow-neon-cyan text-xs">
                  ⚡
                </div>
                <div class="absolute -bottom-5 px-1.5 py-0.5 rounded bg-carbon-950/90 border border-white/10 text-[9px] font-mono font-bold text-neon-cyan whitespace-nowrap">
                  ${pilot.callsign} (${pilot.speed} km/h)
                </div>
              </div>
            `,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          if (!otherMarkersRef.current[pilot.id]) {
            const marker = L.marker([pilot.lat, pilot.lng], { icon: pilotIcon }).addTo(map);
            marker.bindPopup(`
              <div class="p-1 text-xs space-y-1">
                <div class="font-bold text-white flex items-center justify-between">
                  <span>${pilot.name}</span>
                  <span class="text-[10px] font-mono text-neon-cyan">${pilot.callsign}</span>
                </div>
                <div class="text-gray-300 font-mono text-[11px]">${pilot.car}</div>
                <div class="flex items-center justify-between text-[10px] pt-1 border-t border-white/10 font-mono">
                  <span class="text-neon-lime font-bold">${pilot.speed} km/h</span>
                  <span class="text-gray-400">${pilot.status}</span>
                </div>
              </div>
            `);
            otherMarkersRef.current[pilot.id] = marker;
          } else {
            otherMarkersRef.current[pilot.id].setLatLng([pilot.lat, pilot.lng]);
          }
        });

        // C. Marcadores de Spots & Encontros
        spots.forEach(spot => {
          if (!otherMarkersRef.current[spot.id]) {
            const spotIcon = L.divIcon({
              className: "spot-pin",
              html: `
                <div class="flex flex-col items-center">
                  <div class="px-2 py-0.5 rounded-full bg-neon-lime text-carbon-950 font-black text-[10px] font-mono shadow-neon-lime uppercase flex items-center gap-1 border border-white/20">
                    🏁 ${spot.carsCount} Carros
                  </div>
                  <div class="w-3 h-3 bg-neon-lime rotate-45 -mt-1.5"></div>
                </div>
              `,
              iconSize: [80, 30],
              iconAnchor: [40, 25]
            });

            const marker = L.marker([spot.lat, spot.lng], { icon: spotIcon }).addTo(map);
            marker.bindPopup(`
              <div class="p-1 text-xs">
                <span class="text-[10px] font-mono uppercase text-neon-lime font-bold">${spot.category}</span>
                <div class="font-racing font-bold text-white text-sm mt-0.5">${spot.title}</div>
                <p class="text-gray-300 text-[11px] mt-1">${spot.desc}</p>
                <div class="mt-2 flex items-center justify-between text-[10px] font-mono border-t border-white/10 pt-1">
                  <span class="text-white font-bold">🏁 ${spot.carsCount} pilotos no local</span>
                  <span class="text-neon-lime">${spot.time}</span>
                </div>
              </div>
            `);
            otherMarkersRef.current[spot.id] = marker;
          }
        });

        // D. Marcadores de Alertas (Radar de Polícia e Perigos)
        alerts.forEach(alert => {
          if (!otherMarkersRef.current[alert.id]) {
            const alertIcon = L.divIcon({
              className: "alert-pin",
              html: `
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm ${
                  alert.type === 'police' 
                    ? 'bg-neon-red/30 border-2 border-neon-red police-marker-glow' 
                    : 'bg-amber-500/30 border-2 border-amber-400'
                }">
                  ${alert.type === 'police' ? '🚨' : '⚠️'}
                </div>
              `,
              iconSize: [32, 32],
              iconAnchor: [16, 16]
            });

                  <div className="flex items-center gap-2">
                    <span className="text-xl">🚨</span>
                    <h3 className="font-racing font-bold text-lg text-white">Alertar Radar Móvel ou Polícia</h3>
                  </div>
                  <button onClick={() => setIsAddAlertOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newAlert = {
                    id: "alert-" + Date.now(),
                    type: form.type.value,
                    title: form.title.value,
                    lat: userLocation.lat + (Math.random() - 0.5) * 0.003,
                    lng: userLocation.lng + (Math.random() - 0.5) * 0.003,
                    desc: form.desc.value,
                    reporter: "Você (M2)",
                    time: "agora mesmo"
                  };
                  setAlerts([newAlert, ...alerts]);
                  setIsAddAlertOpen(false);
                  SoundFx.playAlert();
                  showToast("Alerta emitido para todos os pilotos do radar!");
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-400 font-mono block mb-1">Tipo de Alerta</label>
                    <select name="type" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-red">
                      <option value="police">Viatura com Radar Móvel</option>
                      <option value="police">Comando / Blitz Policial</option>
                      <option value="hazard">Óleo ou Cascalho na Pista</option>
                      <option value="hazard">Câmera de Velocidade Nova</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-gray-400 font-mono block mb-1">Título Rápido</label>
                    <input name="title" required placeholder="Ex: Radar sob o viaduto da Marginal" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-red" />
                  </div>

                  <div>
                    <label className="text-gray-400 font-mono block mb-1">Detalhes do Ponto</label>
                    <textarea name="desc" rows="2" placeholder="Ex: Escondidos atrás da mureta, sentido bairro..." className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-neon-red"></textarea>
                  </div>

                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsAddAlertOpen(false)} className="px-4 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-neon-red text-white font-black shadow-neon-red">Emitir Alerta Imediato</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderizar na DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
