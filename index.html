              }`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              <span>Custos</span>
            </button>

            <button 
              onClick={() => setActiveTab("feed")}
              className={`flex flex-col items-center gap-1 p-2 rounded-xl text-xs font-bold transition-all ${
                activeTab === "feed" ? "text-neon-lime" : "text-gray-400"
              }`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
              <span>Paddock</span>
            </button>
          </div>

          {/* ===================================================================
              MODAIS INTERATIVOS (ADICIONAR MOD, DESPESA, NOVO POST)
             =================================================================== */}
          
          {/* MODAL 1: ADICIONAR MOD */}
          {isAddModOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-lg w-full p-6 border border-white/10 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-lg text-white">Adicionar Modificação / Peça</h3>
                  <button onClick={() => setIsAddModOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newMod = {
                    id: "mod-" + Date.now(),
                    carId: activeCarId,
                    name: form.name.value,
                    brand: form.brand.value,
                    category: form.category.value,
                    cost: parseFloat(form.cost.value) || 0,
                    powerGain: form.powerGain.value || "Estético / Dinâmico",
                    status: form.status.value,
                    date: new Date().toLocaleDateString('pt-BR'),
                    notes: form.notes.value || "Instalação registrada via GridZone."
                  };
                  setMods([newMod, ...mods]);
                  setIsAddModOpen(false);
                  showToast("Novo Mod adicionado à sua garagem!");
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-400 font-mono block mb-1">Nome do Mod / Peça</label>
                    <input name="name" required placeholder="Ex: Downpipe Inox 3 polegadas" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-gray-400 font-mono block mb-1">Fabricante / Marca</label>
                      <input name="brand" required placeholder="Ex: Milltek / Eventuri" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime" />
                    </div>
                    <div>
                      <label className="text-gray-400 font-mono block mb-1">Categoria</label>
                      <select name="category" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime">
                        <option>Escape</option>
                        <option>Admissão & Ar</option>
                        <option>Eletrônica & Injeção</option>
                        <option>Suspensão</option>
                        <option>Freios</option>
                        <option>Rodas & Pneus</option>
                        <option>Estética & Aero</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-gray-400 font-mono block mb-1">Custo Total (R$)</label>
                      <input name="cost" type="number" step="0.01" required placeholder="Ex: 4500" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime" />
                    </div>
                    <div>
                      <label className="text-gray-400 font-mono block mb-1">Ganho de Potência</label>
                      <input name="powerGain" placeholder="Ex: +18 cv / +30 Nm" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime" />
                    </div>
                  </div>

                  <div>
                    <label className="text-gray-400 font-mono block mb-1">Status de Instalação</label>
                    <select name="status" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime">
                      <option>Instalado</option>
                      <option>Na Garagem (A Instalar)</option>
                      <option>Lista de Desejos</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-gray-400 font-mono block mb-1">Observações Técnicas</label>
                    <textarea name="notes" rows="2" placeholder="Detalhes da instalação, mapa de injeção ou ajustes..." className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-neon-lime"></textarea>
                  </div>

                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsAddModOpen(false)} className="px-4 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-neon-lime text-carbon-950 font-black shadow-neon-lime">Salvar Mod</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: LANÇAR DESPESA */}
          {isAddExpenseOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-white/10 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-lg text-white">Lançar Nova Despesa</h3>
                  <button onClick={() => setIsAddExpenseOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newExpense = {
                    id: "exp-" + Date.now(),
                    carId: activeCarId,
                    desc: form.desc.value,
                    category: form.category.value,
                    amount: parseFloat(form.amount.value) || 0,
                    km: parseInt(form.km.value) || activeCar.currentKm,
                    date: new Date().toLocaleDateString('pt-BR')
                  };
                  setExpenses([newExpense, ...expenses]);
                  setIsAddExpenseOpen(false);
                  showToast("Despesa lançada com sucesso no diário!");
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-400 font-mono block mb-1">Descrição do Gasto</label>
                    <input name="desc" required placeholder="Ex: Gasolina Podium 50 Litros" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-red" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-gray-400 font-mono block mb-1">Categoria</label>
                      <select name="category" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-red">
                        <option>Combustível</option>
                        <option>Manutenção</option>
                        <option>Peças & Mods</option>
                        <option>Seguro & Taxas</option>
                        <option>Estética & Detailing</option>
                        <option>Track Day & Eventos</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-gray-400 font-mono block mb-1">Valor (R$)</label>
                      <input name="amount" type="number" step="0.01" required placeholder="Ex: 480.00" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-red" />
                    </div>
                  </div>

                  <div>
                    <label className="text-gray-400 font-mono block mb-1">KM do Veículo no Momento</label>
                    <input name="km" type="number" defaultValue={activeCar.currentKm} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-red" />
                  </div>

                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsAddExpenseOpen(false)} className="px-4 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-neon-red text-white font-black shadow-neon-red">Lançar Despesa</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: NOVO POST NO FEED */}
          {isNewPostOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-lg w-full p-6 border border-white/10 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-lg text-white">Criar Post no Paddock</h3>
                  <button onClick={() => setIsNewPostOpen(false)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newPost = {
                    id: "post-" + Date.now(),
                    authorName: "Você (Piloto Oficial)",
                    authorAvatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80",
                    carTag: activeCar.name,
                    timeAgo: "agora mesmo",
                    content: form.content.value,
                    imageUrl: form.imageUrl.value || activeCar.heroImage,
                    likes: 1,
                    isLiked: true,
                    tags: ["#GridZone", `#${activeCar.name.split(" ")[0]}`, "#Motorsport"],
                    comments: []
                  };
                  setPosts([newPost, ...posts]);
                  setIsNewPostOpen(false);
                  setActiveTab("feed");
                  showToast("Publicação postada no paddock da comunidade!");
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-400 font-mono block mb-1">O que você fez no carro hoje?</label>
                    <textarea name="content" required rows="3" placeholder="Compartilhe seu tempo de volta, sensação pós-remap ou encontro de carros..." className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime"></textarea>
                  </div>

                  <div>
                    <label className="text-gray-400 font-mono block mb-1">URL da Imagem / Foto do Carro</label>
                    <input name="imageUrl" defaultValue={activeCar.heroImage} placeholder="https://..." className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-neon-lime" />
                    <span className="text-[10px] text-gray-500 font-mono mt-1 block">Por padrão usaremos a foto da sua garagem ativa.</span>
                  </div>

                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsNewPostOpen(false)} className="px-4 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-neon-lime text-carbon-950 font-black shadow-neon-lime">Publicar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===================================================================
              FOOTER DISCRETO & MINIMALISTA
             =================================================================== */}
          <footer className="border-t border-white/5 py-8 mt-12 bg-carbon-950">
            <div className="max-w-7xl mx-auto px-4 text-center">
              <div className="flex items-center justify-center gap-2 mb-2">
                <span className="font-racing font-bold text-white tracking-widest text-sm">GRID<span className="text-neon-lime">ZONE</span></span>
                <span className="text-gray-600">•</span>
                <span className="text-xs font-mono text-gray-400">Garagens Virtuais & Performance Automotiva</span>
              </div>
              <p className="text-[11px] text-gray-500">Desenvolvido com Next.js Architecture • React 18 • Tailwind CSS • Deploy contínuo no GitHub Pages & Vercel</p>
            </div>
          </footer>

        </div>
      );
    }

    // RENDERIZAR NA DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
