    function getDistanceBetween(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return "Calculando...";
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const d = R * c;
      if (d < 1) {
        return `${Math.round(d * 1000)}m`;
      }
      return `${d.toFixed(1)} km`;
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // =========================================================================

    const SoundFx = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      },
      playLike() {
        try {
          const ctx = this.getCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
          osc.start();
          osc.stop(ctx.currentTime + 0.16);

          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.start();

          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();

            if (data && data.success && data.latitude && data.longitude) {
              const detectedCity = `${data.city || "Tupã"} - ${data.region_code || "SP"}`;
              setMyCity(detectedCity);
              setCurrentUser(prev => ({ ...prev, city: detectedCity }));
              setMyLocation({ lat: data.latitude, lng: data.longitude });
              
              if (mapInstanceRef.current) {
                mapInstanceRef.current.panTo([data.latitude, data.longitude], { animate: true });
              }
            }
          } catch(e) {
            setMyCity("Tupã - SP");
            setMyLocation(TUPA_COORDS);
          }
        };

        fetchIpLocation();
      }, []);

      // -----------------------------------------------------------------------
      // 2. GPS NATIVO RIGOROSO (VELOCIDADE EXATA: 0 KM/H PARADO)
      // -----------------------------------------------------------------------
      useEffect(() => {
        if ("geolocation" in navigator) {
          const watchId = navigator.geolocation.watchPosition(
            (pos) => {
              const { latitude, longitude, speed, heading } = pos.coords;
              const now = Date.now();
              setMyLocation({ lat: latitude, lng: longitude });
              setHasRealGps(true);
              if (heading) setGpsHeading(Math.round(heading));

              // Medição de hardware do sensor GPS
              if (speed !== null && speed !== undefined && !isNaN(speed) && speed >= 0) {
                const kmh = Math.round(speed * 3.6);
                setExactSpeed(kmh < 2.5 ? 0 : kmh);
              } 
              // Derivada de distância
              else if (lastGpsPointRef.current) {
                const prev = lastGpsPointRef.current;
                const timeDeltaSec = (now - prev.time) / 1000;
                if (timeDeltaSec >= 1 && timeDeltaSec <= 10) {
                  const distMeters = getDistanceMeters(prev.lat, prev.lng, latitude, longitude);
                  if (distMeters < 4.0) {
                    setExactSpeed(0);
                  } else {
                    const calculatedKmh = Math.round((distMeters / timeDeltaSec) * 3.6);
                    setExactSpeed(calculatedKmh > 360 ? 0 : calculatedKmh);
                  }
                }
              } else {
                setExactSpeed(0);
              }

              lastGpsPointRef.current = { lat: latitude, lng: longitude, time: now };
            },
            () => {
              setExactSpeed(0);
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 6000 }
          );

          return () => navigator.geolocation.clearWatch(watchId);
        }
      }, []);

      // -----------------------------------------------------------------------
      // 3. MULTIPLAYER MQTT: APENAS PILOTOS REAIS CONECTADOS AO VIVO!
      // -----------------------------------------------------------------------
      useEffect(() => {
        // Conecta ao broker MQTT público via WebSockets para sincronizar pilotos reais
        if (typeof mqtt !== "undefined" && mqtt.connect) {
          try {
            const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
              clientId: "gridzone_" + currentUser.id + "_" + Math.random().toString(36).substring(2, 6),
              clean: true,
              reconnectPeriod: 4000,
              connectTimeout: 8000
            });
            mqttClientRef.current = client;

            client.on("connect", () => {
              client.subscribe("gridzone/pilots/#");
              client.subscribe(`gridzone/challenges/${currentUser.id}`);
            });

            client.on("message", (topic, message) => {
              try {
                const data = JSON.parse(message.toString());
                if (topic.startsWith("gridzone/pilots/")) {
                  const pilotId = topic.replace("gridzone/pilots/", "");
                  if (pilotId !== currentUser.id) {
                    setLivePilots(prev => ({
                      ...prev,
                      [pilotId]: { ...data, lastSeen: Date.now() }
                    }));
                  }
                }
                if (topic === `gridzone/challenges/${currentUser.id}`) {
                  setActiveChallengeReceived(data);
                  SoundFx.playChallenge();
                  if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 500]);
                }
              } catch(e) {}
            });
          } catch(e) {}
        }

        return () => {
          if (mqttClientRef.current) {
            try { mqttClientRef.current.end(); } catch(e) {}
          }
        };
      }, [currentUser.id]);

      // Broadcast da posição do piloto real a cada 2.5s
      useEffect(() => {
        const sendUpdate = () => {
          const client = mqttClientRef.current;
          if (client && client.connected) {
            const payload = {
              id: currentUser.id,
              name: currentUser.name,
              username: currentUser.username,
              car: currentUser.car,
              power: currentUser.power,
              city: myCity,
              lat: myLocation.lat,
              lng: myLocation.lng,
              speed: exactSpeed,
              heading: gpsHeading,
              isVip: currentUser.isVip,
              timestamp: Date.now()
            };
            client.publish(`gridzone/pilots/${currentUser.id}`, JSON.stringify(payload));
          }
        };

        sendUpdate();
        const interval = setInterval(sendUpdate, 2500);
        return () => clearInterval(interval);
      }, [myLocation, exactSpeed, gpsHeading, currentUser, myCity]);

      // Limpeza de pilotos reais desconectados (há mais de 25 segundos sem sinal)
      useEffect(() => {
        const interval = setInterval(() => {
          const now = Date.now();
          setLivePilots(prev => {
            let changed = false;
            const updated = { ...prev };
            Object.keys(updated).forEach(id => {
              if (now - (updated[id].lastSeen || updated[id].timestamp || now) > 25000) {
                delete updated[id];
                changed = true;
              }
            });
            return changed ? updated : prev;
          });
        }, 5000);
        return () => clearInterval(interval);
      }, []);

      // -----------------------------------------------------------------------
      // 4. MAPA FULLSCREEN ESRI WORLD STREET MAP (WAZE DOS PILOTOS VIP)
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (activeTab !== "radar" || !currentUser.isVip) return;

        const container = document.getElementById("waze-fullscreen-map");
        if (!container) return;

        let map = mapInstanceRef.current;

        if (container._leaflet_id && !map) {
          container._leaflet_id = null;
        }

        if (!map) {
          try {
            map = L.map("waze-fullscreen-map", {
              center: [myLocation.lat, myLocation.lng],
              zoom: 15,
              zoomControl: false,
              attributionControl: false
            });

            // ESRI World Street Map (Estradas amarelas/laranjas estilo Waze limpo)
            const tileLayer = L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
              maxZoom: 19
            }).addTo(map);

            tileLayerRef.current = tileLayer;

            const markersGroup = L.layerGroup().addTo(map);
            markersGroupRef.current = markersGroup;
            mapInstanceRef.current = map;

            setTimeout(() => {
              if (map) map.invalidateSize();
            }, 300);
          } catch(e) {}
        } else {
          setTimeout(() => {
            if (map) map.invalidateSize();
          }, 200);
        }
      }, [activeTab, currentUser.isVip]);

      // Atualiza marcadores dos pilotos reais no mapa
      useEffect(() => {
        if (activeTab !== "radar" || !currentUser.isVip) return;
        renderMapMarkers();
      }, [activeTab, currentUser.isVip, myLocation, livePilots, myCity]);

      const renderMapMarkers = () => {
        const map = mapInstanceRef.current;
        const group = markersGroupRef.current;
        if (!map || !group) return;

        group.clearLayers();

        // 1. Seu Carro no Radar
        const myWazeIcon = L.divIcon({
          className: "my-waze-car",
          html: `
            <div class="relative flex items-center justify-center cursor-pointer">
              <div class="w-16 h-16 bg-neon-lime/30 rounded-full waze-car-halo absolute"></div>
              <div class="w-11 h-11 bg-carbon-950 border-3 border-neon-lime rounded-full flex items-center justify-center shadow-waze-glow z-10 text-xl font-black">
                🏎️
              </div>
              <div class="absolute -bottom-7 px-2.5 py-0.5 rounded-full bg-carbon-950/95 border border-neon-lime text-[10px] font-racing font-bold text-neon-lime whitespace-nowrap shadow-2xl flex items-center gap-1">
                <span>${currentUser.name}</span>
                <span class="text-gray-400">•</span>
                <span>${currentUser.car}</span>
                <span class="text-neon-cyan font-mono">[📍 ${myCity}]</span>
              </div>
            </div>
          `,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        L.marker([myLocation.lat, myLocation.lng], { icon: myWazeIcon }).addTo(group);

        // 2. Apenas Pilotos Reais Conectados
        Object.values(livePilots).forEach(pilot => {
          const opponentCity = pilot.city || myCity || "Tupã - SP";

          const opponentWazeIcon = L.divIcon({
            className: "opponent-waze-car",
            html: `
              <div class="relative flex items-center justify-center cursor-pointer">
                <div class="w-14 h-14 bg-neon-red/35 rounded-full opponent-waze-halo absolute"></div>
                <div class="w-10 h-10 bg-carbon-950 border-2 border-neon-red rounded-full flex items-center justify-center shadow-waze-alert text-base font-bold text-white z-10">
                  ⚡
                </div>
                <div class="absolute -bottom-7 px-2.5 py-0.5 rounded-full bg-carbon-950/95 border border-neon-red/70 text-[10px] font-mono font-bold text-white whitespace-nowrap shadow-2xl flex items-center gap-1">
                  <span>${pilot.name}</span>
                  <span class="text-neon-red font-bold">(${pilot.car})</span>
                  <span class="text-neon-cyan font-bold bg-carbon-900 px-1.5 py-0.2 rounded">📍 ${opponentCity}</span>
                </div>
              </div>
            `,
            iconSize: [40, 40],
            iconAnchor: [20, 20]
          });

          const m = L.marker([pilot.lat, pilot.lng], { icon: opponentWazeIcon }).addTo(group);
          m.on("click", () => {
            setSelectedOpponent({ ...pilot, city: opponentCity });
            SoundFx.playSonar();
          });
        });
      };

      // -----------------------------------------------------------------------
      // 5. INTERAÇÕES SOCIAIS (CURTIR, COMENTAR, NOVO POST, SEGUIR)
      // -----------------------------------------------------------------------
      const handleToggleLike = (postId) => {
        SoundFx.playLike();
        setPosts(prev => prev.map(p => {
          if (p.id === postId) {
            const nextLiked = !p.isLiked;
            return {
              ...p,
              isLiked: nextLiked,
              likes: nextLiked ? p.likes + 1 : Math.max(0, p.likes - 1)
            };
          }
          return p;
        }));
      };

      const handleToggleSave = (postId) => {
        SoundFx.playSonar();
        setPosts(prev => prev.map(p => {
          if (p.id === postId) {
            const nextSaved = !p.isSaved;
            showToast(nextSaved ? "💾 Post salvo nos seus favoritos!" : "Post removido dos favoritos.");
            return { ...p, isSaved: nextSaved };
          }
          return p;
        }));
      };

      const handleToggleFollow = (username) => {
        SoundFx.playSonar();
        setPosts(prev => prev.map(p => {
          if (p.username === username) {
            const nextState = !p.isFollowing;
            showToast(nextState ? `Você começou a seguir ${username}` : `Você deixou de seguir ${username}`);
            return { ...p, isFollowing: nextState };
          }
          return p;
        }));
      };

      const handleAddComment = (postId, text) => {
        if (!text || !text.trim()) return;
        const newC = {
          id: "c_" + Date.now(),
          user: currentUser.name,
          username: currentUser.username,
          text: text.trim()
        };
        setPosts(prev => prev.map(p => {
          if (p.id === postId) {
            return {
              ...p,
              comments: [...(p.comments || []), newC]
            };
          }
          return p;
        }));
        showToast("💬 Comentário publicado!");
      };

      // Desafio de racha
      const handleSendChallenge = (opponent) => {
        const client = mqttClientRef.current;
        if (client && client.connected) {
          const payload = {
            challengerName: currentUser.name,
            challengerCar: currentUser.car,
            challengerPower: currentUser.power,
            challengerCity: myCity,
            lat: myLocation.lat,
            lng: myLocation.lng,
            timestamp: Date.now()
          };
          client.publish(`gridzone/challenges/${opponent.id}`, JSON.stringify(payload));
          showToast(`⚡ Desafio de racha enviado para ${opponent.name}!`);
          setSelectedOpponent(null);
        } else {
          showToast(`⚡ Desafio de racha enviado para ${opponent.name}!`);
          setSelectedOpponent(null);
        }
      };

      // Ativação da Assinatura VIP
      const handleConfirmVipSubscription = () => {
        setIsVipProcessing(true);
        setTimeout(() => {
          setIsVipProcessing(false);
          const updatedUser = {
            ...currentUser,
            isVip: true,
            vipPlan: selectedVipPlan,
            vipExpires: "29/11/2026"
          };
          setCurrentUser(updatedUser);
          setIsVipModalOpen(false);
          SoundFx.playVipSuccess();
          showToast("🎉 ASSINATURA VIP ATIVADA! Bem-vindo ao Waze dos Pilotos!");
          setActiveTab("radar");
        }, 1500);
      };

      // Mudança de Aba com Checagem de VIP para o Radar Waze
      const handleTabChange = (tabName) => {
        if (tabName === "radar") {
          if (!currentUser.isVip) {
            setIsVipModalOpen(true);
            return;
          }
        }
        setActiveTab(tabName);
      };

      // Quantidade de pilotos reais conectados
      const realPilotsCount = Object.keys(livePilots).length;

      return (
        <div className="relative w-full min-h-screen bg-carbon-950 text-white font-sans overflow-hidden">

          {/* ===================================================================
              HEADER SUPERIOR (ESTILO INSTAGRAM + LOGO + STATUS VIP)
             =================================================================== */}
          <header className="sticky top-0 z-40 w-full bg-carbon-950/90 backdrop-blur-xl border-b border-white/10 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="relative">
                <img src="logo.jpg" alt="GridZone" className="w-10 h-10 rounded-xl object-cover border border-neon-lime/40 shadow-neon-lime" />
                {currentUser.isVip && (
                  <span className="absolute -top-1.5 -right-1.5 px-1 py-0.2 bg-gradient-to-r from-neon-gold to-neon-amber text-carbon-950 font-black text-[9px] rounded-full font-racing shadow-neon-gold">
                    VIP
                  </span>
                )}
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="font-racing font-black text-xl tracking-wider text-white">GRIDZONE</h1>
                  <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-carbon-850 border border-white/10 text-neon-lime">
                    {currentUser.isVip ? "PRO PILOT" : "SOCIAL"}
                  </span>
                </div>
                <p className="text-[11px] font-mono text-gray-400">📍 {myCity}</p>
              </div>
            </div>

            {/* Ações do Topo */}
            <div className="flex items-center gap-2">
              {!currentUser.isVip ? (
                <button 
                  onClick={() => setIsVipModalOpen(true)}
                  className="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-neon-gold to-neon-amber text-carbon-950 font-racing font-bold text-xs flex items-center gap-1.5 shadow-neon-gold hover:scale-105 transition-all"
                >
                  <span>👑</span>
                  <span>Desbloquear Waze VIP</span>
                </button>
              ) : (
                <div className="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-neon-lime/10 border border-neon-lime/30 rounded-full text-[11px] font-racing text-neon-lime font-bold">
                  <span>⚡</span>
                  <span>VIP ATIVO</span>
                </div>
              )}

              <button 
                onClick={() => setIsNewPostModalOpen(true)}
                className="w-9 h-9 rounded-full bg-neon-lime text-carbon-950 flex items-center justify-center font-black text-lg shadow-neon-lime hover:scale-105 transition-all"
                title="Novo Post"
              >
                +
              </button>

              <button 
                onClick={() => setIsAuthModalOpen(true)}
                className="w-9 h-9 rounded-full overflow-hidden border border-white/20 hover:border-neon-lime transition-all"
                title="Meu Perfil / Trocar Conta"
              >
                <img src={currentUser.avatar} className="w-full h-full object-cover" />
              </button>
            </div>
          </header>

          {/* ===================================================================
              CONTEÚDO PRINCIPAL DAS ABAS
             =================================================================== */}
          <main className="pb-24">

            {/* =================================================================
                ABA 1: FEED SOCIAL (ESTILO INSTAGRAM)
               ================================================================= */}
            {activeTab === "feed" && (
              <div className="max-w-xl mx-auto px-2 sm:px-4 py-4 space-y-6">

                {/* 1. CARROSSEL DE STORIES DOS PILOTOS */}
                <div className="flex items-center gap-4 overflow-x-auto pb-2 pt-1 no-scrollbar border-b border-white/5">
                  {/* Seu Story */}
                  <div 
                    onClick={() => setIsNewPostModalOpen(true)}
                    className="flex flex-col items-center gap-1.5 flex-shrink-0 cursor-pointer group"
                  >
                    <div className="relative w-16 h-16 rounded-full p-0.5 border-2 border-dashed border-neon-lime/70 group-hover:scale-105 transition-transform flex items-center justify-center bg-carbon-900">
                      <img src={currentUser.avatar} className="w-full h-full rounded-full object-cover" />
                      <div className="absolute bottom-0 right-0 w-5 h-5 bg-neon-lime text-carbon-950 font-black rounded-full flex items-center justify-center text-xs shadow-lg">
                        +
                      </div>
                    </div>
                    <span className="text-[11px] font-mono text-gray-300">Seu Story</span>
                  </div>

                  {/* Stories da Comunidade */}
                  {storiesList.map(st => (
                    <div 
                      key={st.id}
                      onClick={() => { setActiveStory(st); setIsStoryViewerOpen(true); }}
                      className="flex flex-col items-center gap-1.5 flex-shrink-0 cursor-pointer group"
                    >
                      <div className="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-neon-lime via-neon-cyan to-neon-red group-hover:scale-105 transition-transform">
                        <div className="w-full h-full rounded-full p-0.5 bg-carbon-950">
                          <img src={st.avatar} className="w-full h-full rounded-full object-cover" />
                        </div>
                      </div>
                      <span className="text-[11px] font-mono text-gray-300 truncate max-w-[70px]">{st.author}</span>
                    </div>
                  ))}
                </div>

                {/* BANNER DE BOAS-VINDAS / DESBLOQUEIO WAZE VIP */}
                {!currentUser.isVip && (
                  <div className="glass-panel rounded-2xl p-4 border border-neon-gold/30 bg-gradient-to-r from-neon-gold/10 via-carbon-900 to-neon-red/10 flex items-center justify-between gap-3">
                    <div className="space-y-1">
                      <div className="flex items-center gap-1.5 font-racing font-bold text-sm text-neon-gold">
                        <span>👑</span>
                        <span>RADAR WAZE DOS PILOTOS BLOQUEADO</span>
                      </div>
                      <p className="text-xs text-gray-300">
                        Assine o plano mensal por apenas <strong className="text-white">R$ 29,90/mês</strong> e localize pilotos e rachadores reais na sua cidade em tempo real!
                      </p>
                    </div>
                    <button 
                      onClick={() => setIsVipModalOpen(true)}
                      className="px-4 py-2 bg-gradient-to-r from-neon-gold to-neon-amber text-carbon-950 font-racing font-black text-xs rounded-xl shadow-neon-gold whitespace-nowrap hover:scale-105 transition-all"
                    >
                      Desbloquear
                    </button>
                  </div>
                )}

                {/* 2. FEED DE POSTAGENS DOS CARROS E EVENTOS (ESTILO INSTAGRAM) */}
                <div className="space-y-6">
                  {posts.map(post => (
                    <article key={post.id} className="glass-panel rounded-3xl border border-white/10 overflow-hidden shadow-2xl transition-all">
                      
                      {/* Topo do Post: Autor, Carro e Seguir */}
                      <div className="p-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <img src={post.avatar} className="w-10 h-10 rounded-full object-cover border border-neon-lime" />
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className="font-bold text-sm text-white">{post.author}</span>
                              <span className="text-xs font-mono text-gray-400">{post.username}</span>
                              {post.isVip && (
                                <span className="text-[10px] px-1 bg-neon-gold/20 text-neon-gold rounded border border-neon-gold/40 font-bold">
                                  VIP
                                </span>
                              )}
                            </div>
                            <div className="text-[11px] font-mono text-neon-cyan flex items-center gap-1">
                              <span>📍 {post.city}</span>
                              <span className="text-gray-500">•</span>
                              <span className="text-gray-400">{post.time}</span>
                            </div>
                          </div>
                        </div>

                        {post.username !== currentUser.username && (
                          <button 
                            onClick={() => handleToggleFollow(post.username)}
                            className={`px-3 py-1 rounded-full text-xs font-racing font-bold transition-all ${
                              post.isFollowing 
                                ? "bg-carbon-800 text-gray-300 border border-white/10" 
                                : "bg-neon-lime text-carbon-950 font-black shadow-neon-lime"
                            }`}
                          >
                            {post.isFollowing ? "Seguindo" : "Seguir"}
                          </button>
                        )}
                      </div>

                      {/* Imagem do Carro / Evento */}
                      <div className="relative w-full aspect-square sm:aspect-video bg-black overflow-hidden group">
                        <img 
                          src={post.image} 
                          alt={post.car} 
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                        />
                        {/* Tag de Categoria */}
                        <div className="absolute top-3 left-3 px-3 py-1 rounded-full bg-carbon-950/85 backdrop-blur-md border border-white/15 text-[11px] font-racing font-bold text-neon-lime">
                          {post.category || "Meu Projeto"}
                        </div>
                      </div>

                      {/* Barra de Ações: Like, Comentário, Salvar */}
                      <div className="p-4 space-y-3">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-4">
                            <button 
                              onClick={() => handleToggleLike(post.id)}
                              className="flex items-center gap-1.5 text-lg hover:scale-110 transition-transform"
                            >
                              <span className={post.isLiked ? "text-neon-red scale-110" : "text-gray-300"}>
                                {post.isLiked ? "❤️" : "🤍"}
                              </span>
                              <span className="font-mono text-xs font-bold text-white">{post.likes}</span>
                            </button>

                            <button className="flex items-center gap-1.5 text-lg text-gray-300 hover:text-white transition-colors">
                              <span>💬</span>
                              <span className="font-mono text-xs font-bold text-white">{post.comments?.length || 0}</span>
                            </button>

                            <button 
                              onClick={() => {
                                navigator.clipboard.writeText(window.location.href);
                                showToast("🔗 Link do post copiado!");
                              }}
                              className="text-lg text-gray-300 hover:text-white transition-colors"
                              title="Compartilhar"
                            >
                              ↗️
                            </button>
                          </div>

                          <button 
                            onClick={() => handleToggleSave(post.id)}
                            className="text-lg hover:scale-110 transition-transform"
                          >
                            {post.isSaved ? "🔖" : "📑"}
                          </button>
                        </div>

                        {/* Legenda & Ficha do Carro */}
                        <div className="space-y-1 text-xs">
                          <div className="font-racing font-bold text-sm text-neon-lime flex items-center gap-2">
                            <span>🚗</span>
                            <span>{post.car}</span>
                          </div>
                          <p className="text-gray-200 leading-relaxed">
                            <strong className="text-white font-bold mr-1">{post.username}</strong>
                            {post.caption}
                          </p>
                        </div>

                  <h3 className="font-racing font-black text-2xl text-white pt-2">DESBLOQUEIE O RADAR VIP</h3>
                  <p className="text-xs font-mono text-gray-300">
                    Veja rachadores e pilotos reais em {myCity} e envie convites de racha com telemetria GPS exata.
                  </p>
                </div>

                {/* Vantagens do Plano */}
                <div className="p-3.5 bg-carbon-900 rounded-2xl border border-white/10 space-y-2 text-xs">
                  <div className="flex items-center gap-2 text-gray-200">
                    <span className="text-neon-lime font-bold">✓</span>
                    <span><strong>Apenas Pilotos Reais:</strong> sem bots, encontre carros reais na rua</span>
                  </div>
                  <div className="flex items-center gap-2 text-gray-200">
                    <span className="text-neon-lime font-bold">✓</span>
                    <span><strong>Velocímetro Exato HUD:</strong> 0 km/h estrito quando parado</span>
                  </div>
                  <div className="flex items-center gap-2 text-gray-200">
                    <span className="text-neon-lime font-bold">✓</span>
                    <span><strong>Desafios de Racha:</strong> convites instantâneos com som de largada</span>
                  </div>
                  <div className="flex items-center gap-2 text-gray-200">
                    <span className="text-neon-lime font-bold">✓</span>
                    <span><strong>Alertas Waze:</strong> blitz policial, pista e radares comunitários</span>
                  </div>
                </div>

                {/* Seleção do Plano */}
                <div className="grid grid-cols-2 gap-3">
                  <div 
                    onClick={() => setSelectedVipPlan("monthly")}
                    className={`p-3 rounded-2xl border cursor-pointer text-center transition-all ${
                      selectedVipPlan === "monthly" 
                        ? "bg-neon-gold/15 border-neon-gold text-white shadow-neon-gold" 
                        : "bg-carbon-900 border-white/10 text-gray-400"
                    }`}
                  >
                    <div className="text-[10px] font-mono font-bold uppercase">PLANO MENSAL</div>
                    <div className="font-racing font-black text-xl text-white">R$ 29,90</div>
                    <div className="text-[10px] text-gray-400">por mês</div>
                  </div>

                  <div 
                    onClick={() => setSelectedVipPlan("annual")}
                    className={`p-3 rounded-2xl border cursor-pointer text-center relative transition-all ${
                      selectedVipPlan === "annual" 
                        ? "bg-neon-lime/15 border-neon-lime text-white shadow-neon-lime" 
                        : "bg-carbon-900 border-white/10 text-gray-400"
                    }`}
                  >
                    <span className="absolute -top-2 right-2 px-1.5 py-0.2 bg-neon-lime text-carbon-950 font-black text-[9px] rounded-full">
                      ECONOMIZE 45%
                    </span>
                    <div className="text-[10px] font-mono font-bold uppercase">PLANO ANUAL TURBO</div>
                    <div className="font-racing font-black text-xl text-white">R$ 199,90</div>
                    <div className="text-[10px] text-gray-400">12 meses de acesso</div>
                  </div>
                </div>

                {/* Método de Pagamento */}
                <div className="space-y-2 pt-1">
                  <div className="flex justify-between items-center text-xs font-mono text-gray-300">
                    <span>FORMA DE PAGAMENTO:</span>
                    <div className="flex gap-2">
                      <button 
                        type="button" 
                        onClick={() => setVipPaymentMethod("pix")}
                        className={`px-2 py-0.5 rounded ${vipPaymentMethod === "pix" ? "bg-neon-lime text-carbon-950 font-bold" : "bg-carbon-800 text-gray-400"}`}
                      >
                        PIX
                      </button>
                      <button 
                        type="button" 
                        onClick={() => setVipPaymentMethod("card")}
                        className={`px-2 py-0.5 rounded ${vipPaymentMethod === "card" ? "bg-neon-lime text-carbon-950 font-bold" : "bg-carbon-800 text-gray-400"}`}
                      >
                        Cartão
                      </button>
                    </div>
                  </div>

                  {vipPaymentMethod === "pix" ? (
                    <div className="p-3 bg-carbon-950 rounded-2xl border border-white/10 text-center space-y-2">
                      <div className="w-24 h-24 mx-auto bg-white p-2 rounded-xl flex items-center justify-center">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=gridzone-vip-tupa-pix" alt="QR Code Pix" className="w-full h-full" />
                      </div>
                      <div className="text-[11px] font-mono text-gray-300">
                        Chave Pix: <strong className="text-neon-cyan">pix@gridzone.app</strong>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-2 text-xs">
                      <input type="text" placeholder="Número do Cartão" defaultValue="4532 •••• •••• 8912" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono" />
                      <div className="grid grid-cols-2 gap-2">
                        <input type="text" placeholder="Validade (MM/AA)" defaultValue="08/28" className="bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono" />
                        <input type="text" placeholder="CVV" defaultValue="734" className="bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono" />
                      </div>
                    </div>
                  )}
                </div>

                {/* Botão de Finalizar Assinatura */}
                <button 
                  onClick={handleConfirmVipSubscription}
                  disabled={isVipProcessing}
                  className="w-full py-3 rounded-2xl bg-gradient-to-r from-neon-gold via-neon-amber to-neon-lime text-carbon-950 font-racing font-black text-sm tracking-wider shadow-neon-gold hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2"
                >
                  {isVipProcessing ? (
                    <span>⏳ Aprovando Pagamento Instantâneo...</span>
                  ) : (
                    <span>⚡ Confirmar e Liberar Acesso VIP</span>
                  )}
                </button>

              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL: NOVO POST NO FEED (ESTILO INSTAGRAM)
             =================================================================== */}
          {isNewPostModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-md w-full p-6 border border-white/15 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-base text-white">Criar Nova Publicação</h3>
                  <button onClick={() => setIsNewPostModalOpen(false)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>

                <form 
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const newP = {
                      id: "post_" + Date.now(),
                      author: currentUser.name,
                      username: currentUser.username,
                      avatar: currentUser.avatar,
                      city: form.city.value.trim() || myCity,
                      time: "agora",
                      isVip: currentUser.isVip,
                      likes: 1,
                      isLiked: true,
                      car: currentUser.car + ` (${currentUser.power})`,
                      category: form.category.value,
                      image: form.image.value.trim() || "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=1200&q=80",
                      caption: form.caption.value.trim(),
                      comments: []
                    };
                    setPosts(prev => [newP, ...prev]);
                    setIsNewPostModalOpen(false);
                    SoundFx.playLike();
                    showToast("📸 Publicação compartilhada no GridZone!");
                  }}
                  className="space-y-3 text-xs"
                >
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">URL da Foto do Carro / Evento</label>
                    <input 
                      name="image" 
                      type="url" 
                      placeholder="https://images.unsplash.com/... ou link da foto"
                      defaultValue="https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=1200&q=80"
                      className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-neon-lime" 
                    />
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Categoria</label>
                    <select name="category" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-neon-lime">
                      <option value="Meu Projeto / Garagem">🏎️ Meu Projeto / Garagem</option>
                      <option value="Encontro Noturno">🎪 Encontro Noturno</option>
                      <option value="Racha / Arrancada">🏁 Racha / Arrancada</option>
                      <option value="Dica de Oficina / Peças">🔧 Dica de Oficina / Peças</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Cidade do Registro</label>
                    <input 
                      name="city" 
                      type="text" 
                      defaultValue={myCity}
                      className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-neon-lime" 
                    />
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Legenda & Hashtags</label>
                    <textarea 
                      name="caption" 
                      rows="3" 
                      placeholder="Conte sobre seu carro, modificações ou convide a galera para puxar..." 
                      defaultValue="Mais uma melhoria feita no projeto! Pronto pra puxar na pista. 🔥 #GridZone #Racha"
                      className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-neon-lime resize-none"
                    ></textarea>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsNewPostModalOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Publicar Agora</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL: VISUALIZADOR DE STORIES (ESTILO INSTAGRAM)
             =================================================================== */}
          {isStoryViewerOpen && activeStory && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/95 animate-fadeIn">
              <div className="relative max-w-sm w-full h-[85vh] rounded-3xl overflow-hidden bg-carbon-900 border border-white/10 flex flex-col justify-between">
                
                {/* Barra de Progresso no Topo */}
                <div className="absolute top-3 left-3 right-3 z-20 flex gap-1">
                  <div className="h-1 bg-white/30 rounded-full flex-1 overflow-hidden">
                    <div className="h-full bg-white story-progress-bar"></div>
                  </div>
                </div>

                {/* Topo: Autor & Fechar */}
                <div className="absolute top-6 left-3 right-3 z-20 flex items-center justify-between text-white">
                  <div className="flex items-center gap-2">
                    <img src={activeStory.avatar} className="w-8 h-8 rounded-full border border-neon-lime" />
                    <div>
                      <div className="font-bold text-xs">{activeStory.author}</div>
                      <div className="text-[10px] font-mono text-gray-300">{activeStory.time}</div>
                    </div>
                  </div>
                  <button onClick={() => setIsStoryViewerOpen(false)} className="text-white text-xl p-1">✕</button>
                </div>

                {/* Imagem do Story */}
                <img src={activeStory.image} className="w-full h-full object-cover" />

                {/* Legenda na base */}
                <div className="absolute bottom-4 left-3 right-3 z-20 bg-black/60 backdrop-blur-md p-3 rounded-2xl border border-white/10 text-xs text-white">
                  {activeStory.caption}
                </div>

              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL: CADASTRO / LOGIN / EDIÇÃO DO PILOTO
             =================================================================== */}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-md w-full p-6 border border-white/15 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-base text-white">Ficha do Piloto & Cadastro</h3>
                  <button onClick={() => setIsAuthModalOpen(false)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>

                <form 
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const updated = {
                      ...currentUser,
                      name: form.name.value.trim() || "Victor Simão",
                      username: form.username.value.trim() || "@victor_gti",
                      car: form.car.value.trim() || "Golf GTI Stage 3",
                      power: form.power.value.trim() || "380 cv",
                      city: form.city.value.trim() || myCity,
                      bio: form.bio.value.trim()
                    };
                    setCurrentUser(updated);
                    setMyCity(updated.city);
                    setIsAuthModalOpen(false);
                    SoundFx.playSonar();
                    showToast("✓ Cadastro e Perfil atualizados!");
                  }}
                  className="space-y-3 text-xs"
                >
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-gray-300 font-mono block mb-1">Seu Nome / Apelido</label>
                      <input name="name" type="text" defaultValue={currentUser.name} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-bold" />
                    </div>
                    <div>
                      <label className="text-gray-300 font-mono block mb-1">@Usuário</label>
                      <input name="username" type="text" defaultValue={currentUser.username} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-bold" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-gray-300 font-mono block mb-1">Carro Principal</label>
                      <input name="car" type="text" defaultValue={currentUser.car} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-bold" />
                    </div>
                    <div>
                      <label className="text-gray-300 font-mono block mb-1">Potência Estimada (cv)</label>
                      <input name="power" type="text" defaultValue={currentUser.power} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-bold" />
                    </div>
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Sua Cidade Atual</label>
                    <input name="city" type="text" defaultValue={currentUser.city} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white font-bold" />
                  </div>

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Bio do Piloto</label>
                    <textarea name="bio" rows="2" defaultValue={currentUser.bio} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3 py-2 text-white resize-none"></textarea>
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsAuthModalOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300">Fechar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Salvar Alterações</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL: ALERTA DE DESAFIO DE RACHA RECEBIDO EM TEMPO REAL!
             =================================================================== */}
          {activeChallengeReceived && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-sm w-full p-6 border-2 border-neon-red space-y-4 shadow-waze-alert text-center">
                <div className="text-4xl animate-bounce">⚡🏁</div>
                <div>
                  <span className="px-2.5 py-0.5 rounded bg-neon-red text-white font-mono text-[10px] font-bold">
                    DESAFIO DE RACHA RECEBIDO!
                  </span>
                  <h3 className="font-racing font-black text-2xl text-white mt-1">
                    {activeChallengeReceived.challengerName}
                  </h3>
                  <div className="text-xs text-neon-cyan font-mono">
                    📍 {activeChallengeReceived.challengerCity || myCity}
                  </div>
                </div>

                <div className="p-3 bg-carbon-900 rounded-2xl border border-white/10 text-xs">
                  <div className="text-gray-400 font-mono text-[10px]">VEÍCULO DO DESAFIANTE</div>
                  <div className="font-racing font-bold text-white text-base">{activeChallengeReceived.challengerCar}</div>
                  <div className="text-neon-lime font-bold">{activeChallengeReceived.challengerPower}</div>
                </div>

                <div className="flex gap-2">
                  <button 
                    onClick={() => setActiveChallengeReceived(null)}
                    className="flex-1 py-2.5 rounded-xl bg-carbon-800 text-gray-300 font-racing font-bold text-xs"
                  >
                    Recusar
                  </button>
                  <button 
                    onClick={() => {
                      SoundFx.playVipSuccess();
                      showToast(`🏁 DESAFIO ACEITO! Alinhe na pista contra ${activeChallengeReceived.challengerName}!`);
                      setActiveChallengeReceived(null);
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-neon-red text-white font-racing font-black text-xs shadow-waze-alert"
                  >
                    ACEITAR RACHA!
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL: MENU DE REPORTAR DO WAZE (BLITZ, VIATURA, PISTA)
             =================================================================== */}
          {isWazeReportMenuOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-md w-full p-6 border border-white/15 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-sm text-white">Reportar Alerta Waze aos Pilotos</h3>
                  <button onClick={() => setIsWazeReportMenuOpen(false)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-center">
                  <button 
                    onClick={() => {
                      showToast("🚨 Alerta de Blitz Policial transmitido para Tupã - SP!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-850 border border-neon-red/40 space-y-1 transition-all"
                  >
                    <div className="text-2xl">👮‍♂️</div>
                    <div className="font-racing font-bold text-xs text-white">Blitz / Comando</div>
                  </button>

                  <button 
                    onClick={() => {
                      showToast("🚔 Viatura em ronda reportada!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-850 border border-neon-cyan/40 space-y-1 transition-all"
                  >
                    <div className="text-2xl">🚔</div>
                    <div className="font-racing font-bold text-xs text-white">Viatura na Via</div>
                  </button>

                  <button 
                    onClick={() => {
                      showToast("📷 Radar móvel alertado!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-850 border border-neon-amber/40 space-y-1 transition-all"
                  >
                    <div className="text-2xl">📷</div>
                    <div className="font-racing font-bold text-xs text-white">Radar Móvel</div>
                  </button>

                  <button 
                    onClick={() => {
                      showToast("🌧️ Pista escorregadia alertada!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-850 border border-neon-lime/40 space-y-1 transition-all"
                  >
                    <div className="text-2xl">🌧️</div>
                    <div className="font-racing font-bold text-xs text-white">Pista Molhada</div>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ===================================================================
              MODAL: BUSCA MANUAL DE CIDADE / RUA
             =================================================================== */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center p-4 pt-16 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-md w-full p-6 border border-white/15 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-sm text-white">Mudar Cidade / Posição do Radar</h3>
                  <button onClick={() => setIsSearchOpen(false)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>

                <form 
                  onSubmit={async (e) => {
                    e.preventDefault();
                    if (!searchQuery.trim()) return;
                    try {
                      showToast("🔍 Buscando endereço...");
                      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery.trim() + ", Brasil")}`);
                      const data = await res.json();
                      if (data && data.length > 0) {
                        const newLat = parseFloat(data[0].lat);
                        const newLng = parseFloat(data[0].lon);
                        setMyLocation({ lat: newLat, lng: newLng });
                        setMyCity(searchQuery.trim());
                        if (mapInstanceRef.current) {
                          mapInstanceRef.current.panTo([newLat, newLng], { animate: true });
                        }
                        showToast(`📍 Movido para: ${data[0].display_name.split(",")[0]}`);
                        setIsSearchOpen(false);
                      } else {
                        showToast("Localização não encontrada.");
                      }
                    } catch(err) {
                      showToast("Erro na busca.");
                    }
                  }}
                  className="space-y-3 text-xs"
                >
                  <input 
                    type="text" 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Ex: Av. Tamoios, Tupã ou Marília, SP" 
                    className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-white font-bold focus:outline-none focus:border-neon-lime"
                  />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsSearchOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Ir Para Local</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===================================================================
              TOAST NOTIFICATION FLUTUANTE
             =================================================================== */}
          {toast.show && (
            <div className="fixed top-16 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none animate-bounce">
              <div className="waze-pill-floating px-4 py-2.5 rounded-2xl border border-neon-lime/40 text-xs font-racing font-bold text-white shadow-2xl flex items-center gap-2">
                <span>⚡</span>
                <span>{toast.msg}</span>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderiza a aplicação
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
