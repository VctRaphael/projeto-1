  <!-- APLICAÇÃO REACT PRINCIPAL GRIDZONE WAZE -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // COORDENADAS REAIS PADRÃO: TUPÃ - SP (ONDE O PILOTO ESTÁ)
    const TUPA_COORDS = { lat: -21.9347, lng: -50.5136 };

    // =========================================================================
    // CÁLCULO DE DISTÂNCIA REAL HAVERSINE (METROS E QUILÔMETROS)
    // =========================================================================
    function getDistanceBetween(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return "Calculando...";
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distKm = R * c;
      if (distKm < 1) {
        return `${Math.round(distKm * 1000)} metros`;
      }
      return `${distKm.toFixed(1)} km`;
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // =========================================================================
    // EFEITOS SONOROS WEBAUDIO (ESTILO WAZE & SIRENE)
    // =========================================================================
    const SoundFx = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playSonar() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      },
      playChallenge() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.2);
          osc.frequency.linearRampToValueAtTime(440, this.ctx.currentTime + 0.4);
          osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.6);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.8);
        } catch(e) {}
      }
    };

    // =========================================================================
    // DADOS INICIAIS DA GARAGEM & CUSTOS
    // =========================================================================
    const INITIAL_CAR = {
      name: "Golf GTI Stage 3",
      year: 2021,
      color: "Preto Ninja",
      engine: "2.0 TSI EA888 Gen 3 Turbo",
      transmission: "DSG 6 Marchas",
      stockHp: 230,
      currentHp: 380,
      stockTorque: 350,
      currentTorque: 510,
      weight: "1.370 kg",
      powerToWeight: "3.60 kg/cv",
      currentKm: 42100,
      status: "Preparado para Racha & Pista",
      zeroToHundred: "4.5 s",
      heroImage: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=1200&q=80"
    };

    const INITIAL_MODS = [
      { id: 1, name: "Downpipe Inox 304 High-Flow", brand: "Nova Racing", category: "Escape", cost: 3200, gain: "+25 cv", status: "Instalado" },
      { id: 2, name: "Intake de Fibra de Carbono R600", brand: "RacingLine", category: "Admissão", cost: 5800, gain: "+15 cv", status: "Instalado" },
      { id: 3, name: "Remap ECU & TCU Stage 3 Custom", brand: "Tork One", category: "Injeção", cost: 4500, gain: "+110 cv", status: "Instalado" },
      { id: 4, name: "Turbina Híbrida IS38 Forjada", brand: "CTS Turbo", category: "Motor", cost: 12800, gain: "+150 cv", status: "Instalado" }
    ];

    const INITIAL_EXPENSES = [
      { id: 1, desc: "Gasolina Podium Petrobras (50 Litros)", category: "Combustível", amount: 445.00, date: "28/10/2026", km: 42100 },
      { id: 2, desc: "Troca de Óleo Motul 300V 5W-40 + Filtro", category: "Manutenção", amount: 890.00, date: "15/10/2026", km: 41500 }
    ];

    const INITIAL_POSTS = [
      {
        id: 1,
        author: "Victor Simão",
        car: "Golf GTI Stage 3 (380cv)",
        avatar: "logo.jpg",
        time: "agora",
        content: "Radar Waze ativo! Quem tiver na região de Tupã ou rodovias próximas, encosta para puxar ou tomar um café no posto! 🏁🔥",
        image: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&w=900&q=80"
      }
    ];

    // =========================================================================
    // COMPONENTE PRINCIPAL
    // =========================================================================
    function App() {
      // Aba Ativa ('radar', 'dashboard', 'garage', 'costs', 'feed')
      const [activeTab, setActiveTab] = useState("radar");

      // Tema do Mapa ('street' = Waze Colorido / 'dark' = Waze Noite)
      const [mapTheme, setMapTheme] = useState("street");

      // CIDADE ATUAL REAL (Detectada automaticamente em Tupã - SP)
      const [myCity, setMyCity] = useState("Tupã - SP");

      // Perfil do Piloto
      const [myProfile, setMyProfile] = useState(() => {
        const saved = localStorage.getItem("gridzone_pilot_profile");
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return {
          id: "pilot_" + Math.random().toString(36).substring(2, 8),
          name: "Victor Simão",
          car: "Golf GTI Stage 3",
          power: "380 cv",
          city: "Tupã - SP",
          status: "Buscando Puxada / Racha"
        };
      });

      // COORDENADAS REAIS DO PILOTO
      const [myLocation, setMyLocation] = useState(TUPA_COORDS);

      // VELOCIDADE RIGOROSAMENTE EXATA (0 KM/H PARADO)
      const [exactSpeed, setExactSpeed] = useState(0);
      const [gpsHeading, setGpsHeading] = useState(135);
      const [hasRealGps, setHasRealGps] = useState(false);
      const lastGpsPointRef = useRef(null);

      // Adversários no Mapa
      const [livePilots, setLivePilots] = useState({});

      // Modais
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [selectedOpponent, setSelectedOpponent] = useState(null);
      const [activeChallengeReceived, setActiveChallengeReceived] = useState(null);
      const [isWazeReportMenuOpen, setIsWazeReportMenuOpen] = useState(false);
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");

      // Toast
      const [toast, setToast] = useState({ show: false, msg: "" });
      const showToast = (msg) => {
        setToast({ show: true, msg });
        SoundFx.playSonar();
        setTimeout(() => setToast({ show: false, msg: "" }), 3500);
      };

      // Referências
      const mapInstanceRef = useRef(null);
      const tileLayerRef = useRef(null);
      const markersGroupRef = useRef(null);
      const mqttClientRef = useRef(null);

      // -----------------------------------------------------------------------
      // 1. AUTO-LOCALIZAÇÃO INTELIGENTE (TUPÃ - SP VIA IP & REVERSE GEOCODING)
      // -----------------------------------------------------------------------
      useEffect(() => {
        // Detecta localização exata do IP (sem bloquear, rápido)
        const fetchIpLocation = async () => {
          try {
            const res = await fetch("https://ipwho.is/");
            const data = await res.json();
            if (data && data.success && data.latitude && data.longitude) {
              const detectedCity = `${data.city || "Tupã"} - ${data.region_code || "SP"}`;
              setMyCity(detectedCity);
              setMyProfile(prev => ({ ...prev, city: detectedCity }));
              setMyLocation({ lat: data.latitude, lng: data.longitude });
              
              if (mapInstanceRef.current) {
                mapInstanceRef.current.panTo([data.latitude, data.longitude], { animate: true });
              }
            }
          } catch(e) {
            // Garante Tupã - SP
            setMyCity("Tupã - SP");
            setMyLocation(TUPA_COORDS);
          }
        };

        fetchIpLocation();
      }, []);

      // -----------------------------------------------------------------------
      // 2. GPS NATIVO DO CELULAR/PC (VELOCIDADE EXATA: 0 KM/H QUANDO PARADO)
      // -----------------------------------------------------------------------
      useEffect(() => {
        if ("geolocation" in navigator) {
          const watchId = navigator.geolocation.watchPosition(
            (pos) => {
              const { latitude, longitude, speed, heading } = pos.coords;
              const now = Date.now();
              setMyLocation({ lat: latitude, lng: longitude });
              setHasRealGps(true);
              if (heading) setGpsHeading(Math.round(heading));

              // 1. Medição direta de hardware do sensor GPS (em m/s)
              if (speed !== null && speed !== undefined && !isNaN(speed) && speed >= 0) {
                const kmh = Math.round(speed * 3.6);
                // Se menor que 2.5 km/h, o carro está parado!
                setExactSpeed(kmh < 2.5 ? 0 : kmh);
              } 
              // 2. Se o dispositivo não der speed, calcula derivada de distância em metros:
              else if (lastGpsPointRef.current) {
                const prev = lastGpsPointRef.current;
                const timeDeltaSec = (now - prev.time) / 1000;
                if (timeDeltaSec >= 1 && timeDeltaSec <= 10) {
                  const distMeters = getDistanceMeters(prev.lat, prev.lng, latitude, longitude);
                  // Filtro rigoroso: se moveu menos de 4 metros, está PARADO (0 km/h)
                  if (distMeters < 4.0) {
                    setExactSpeed(0);
                  } else {
                    const calculatedKmh = Math.round((distMeters / timeDeltaSec) * 3.6);
                    setExactSpeed(calculatedKmh > 360 ? 0 : calculatedKmh);
                  }
                }
              } else {
                setExactSpeed(0); // Parado por padrão!
              }

              lastGpsPointRef.current = { lat: latitude, lng: longitude, time: now };
            },
            () => {
              // Se permissão negada, mantém 0 km/h
              setExactSpeed(0);
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 6000 }
          );

          return () => navigator.geolocation.clearWatch(watchId);
        }
      }, []);

      // -----------------------------------------------------------------------
      // 3. ADVERSÁRIOS MOCKADOS BASEADOS NA CIDADE DO USUÁRIO (TUPÃ - SP)
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (myCity) {
          setLivePilots(prev => {
            const realCount = Object.keys(prev).filter(k => !k.startsWith("bot-")).length;
            if (realCount > 0) return prev;

            return {
              "bot-1": {
                id: "bot-1",
                name: "Guilherme 'Apex'",
                car: "Audi RS3 DaZa 2.5T",
                power: "620 cv",
                city: myCity,
                lat: myLocation.lat + 0.0035,
                lng: myLocation.lng + 0.0042,
                speed: 0, // Parado
                status: "Pronto pra Puxada"
              },
              "bot-2": {
                id: "bot-2",
                name: "Diego K-Tuned",
                car: "Civic Si K24 Turbo",
                power: "430 cv",
                city: myCity,
                lat: myLocation.lat - 0.0045,
                lng: myLocation.lng - 0.0038,
                speed: 0, // Parado no Posto
                status: "Parado no Posto"
              },
              "bot-3": {
                id: "bot-3",
                name: "Thiago Track",
                car: "BMW 320i Stage 3",
                power: "340 cv",
                city: myCity,
                lat: myLocation.lat - 0.0028,
                lng: myLocation.lng + 0.0051,
                speed: 0,
                status: "Buscando Racha"
              }
            };
          });
        }
      }, [myCity, myLocation.lat, myLocation.lng]);

      // -----------------------------------------------------------------------
      // 4. CONEXÃO MQTT WEBSOCKETS MULTIPLAYER
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (typeof mqtt !== "undefined" && mqtt.connect) {
          try {
            const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
              clientId: "waze_" + myProfile.id,
              clean: true,
              reconnectPeriod: 4000,
              connectTimeout: 8000
            });
            mqttClientRef.current = client;

            client.on("connect", () => {
              client.subscribe("gridzone/pilots/#");
              client.subscribe(`gridzone/challenges/${myProfile.id}`);
            });

            client.on("message", (topic, message) => {
              try {
                const data = JSON.parse(message.toString());
                if (topic.startsWith("gridzone/pilots/")) {
                  const pilotId = topic.replace("gridzone/pilots/", "");
                  if (pilotId !== myProfile.id) {
                    setLivePilots(prev => ({
                      ...prev,
                      [pilotId]: { ...data, lastSeen: Date.now() }
                    }));
                  }
                }
                if (topic === `gridzone/challenges/${myProfile.id}`) {
                  setActiveChallengeReceived(data);
                  SoundFx.playChallenge();
                  if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 500]);
                }
              } catch(e) {}
            });
          } catch(e) {}
        }

        return () => {
          if (mqttClientRef.current) {
            try { mqttClientRef.current.end(); } catch(e) {}
          }
        };
      }, [myProfile.id]);

      // Broadcast da sua posição para os adversários a cada 2.5s
      useEffect(() => {
        const sendUpdate = () => {
          const client = mqttClientRef.current;
          if (client && client.connected) {
            const payload = {
              id: myProfile.id,
              name: myProfile.name,
              car: myProfile.car,
              power: myProfile.power,
              city: myCity,
              status: myProfile.status,
              lat: myLocation.lat,
              lng: myLocation.lng,
              speed: exactSpeed, // VELOCIDADE RIGOROSAMENTE EXATA
              heading: gpsHeading,
              timestamp: Date.now()
            };
            client.publish(`gridzone/pilots/${myProfile.id}`, JSON.stringify(payload));
          }
        };

        sendUpdate();
        const interval = setInterval(sendUpdate, 2500);
        return () => clearInterval(interval);
      }, [myLocation, exactSpeed, gpsHeading, myProfile, myCity]);

      // -----------------------------------------------------------------------
      // 5. INICIALIZAR E ATUALIZAR O MAPA FULLSCREEN ESRI WORLD STREET MAP
      // -----------------------------------------------------------------------
      useEffect(() => {
        const container = document.getElementById("waze-fullscreen-map");
        if (!container) return;

        let map = mapInstanceRef.current;

        if (container._leaflet_id && !map) {
          container._leaflet_id = null;
        }

        if (!map) {
          try {
            map = L.map("waze-fullscreen-map", {
              center: [myLocation.lat, myLocation.lng],
              zoom: 15,
              zoomControl: false,
              attributionControl: false
            });

            // ESRI World Street Map (Ruas coloridas estilo Waze, sem watermark!)
            const streetUrl = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}";
            const darkUrl = "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}";
            const currentUrl = mapTheme === "street" ? streetUrl : darkUrl;

            tileLayerRef.current = L.tileLayer(currentUrl, { maxZoom: 19 }).addTo(map);
            markersGroupRef.current = L.layerGroup().addTo(map);
            mapInstanceRef.current = map;
          } catch(err) {
            console.warn("Leaflet error:", err);
          }
        }

        setTimeout(() => { if (mapInstanceRef.current) mapInstanceRef.current.invalidateSize(); }, 80);
        setTimeout(() => { if (mapInstanceRef.current) mapInstanceRef.current.invalidateSize(); }, 350);

        updateWazeMarkers();
      }, [activeTab]);

      // Alternar Dia/Noite
      useEffect(() => {
        if (mapInstanceRef.current && tileLayerRef.current) {
          const streetUrl = "https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}";
          const darkUrl = "https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}";
          tileLayerRef.current.setUrl(mapTheme === "street" ? streetUrl : darkUrl);
        }
      }, [mapTheme]);

      // Atualizar marcadores com cidade e velocidade exata
      useEffect(() => {
        if (mapInstanceRef.current) {
          updateWazeMarkers();
        }
      }, [myLocation, livePilots, exactSpeed, myProfile, myCity]);

      const updateWazeMarkers = () => {
        const map = mapInstanceRef.current;
        const group = markersGroupRef.current;
        if (!map || !group) return;

        group.clearLayers();

        // 1. Seu Carro (Com sua Cidade e Velocidade Exata)
        const myWazeIcon = L.divIcon({
          className: "my-waze-car",
          html: `
            <div class="relative flex items-center justify-center cursor-pointer">
              <div class="w-16 h-16 bg-neon-lime/30 rounded-full waze-car-halo absolute"></div>
              <div class="w-11 h-11 bg-carbon-950 border-3 border-neon-lime rounded-full flex items-center justify-center shadow-waze-glow z-10 text-xl font-black">
                🏎️
              </div>
              <div class="absolute -bottom-7 px-2.5 py-0.5 rounded-full bg-carbon-950/95 border border-neon-lime text-[10px] font-racing font-bold text-neon-lime whitespace-nowrap shadow-2xl flex items-center gap-1">
                <span>${myProfile.name}</span>
                <span class="text-gray-400">•</span>
                <span>${myProfile.car}</span>
                <span class="text-neon-cyan font-mono">[📍 ${myCity}]</span>
              </div>
            </div>
          `,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        L.marker([myLocation.lat, myLocation.lng], { icon: myWazeIcon }).addTo(group);

        // 2. Adversários no Radar (COM CIDADE E VELOCIDADE EXATA!)
        Object.values(livePilots).forEach(pilot => {
          const opponentCity = pilot.city || myCity || "Tupã - SP";

          const opponentWazeIcon = L.divIcon({
            className: "opponent-waze-car",
            html: `
              <div class="relative flex items-center justify-center cursor-pointer">
                <div class="w-14 h-14 bg-neon-red/35 rounded-full opponent-waze-halo absolute"></div>
                <div class="w-10 h-10 bg-carbon-950 border-2 border-neon-red rounded-full flex items-center justify-center shadow-waze-alert text-base font-bold text-white z-10">
                  ⚡
                </div>
                <div class="absolute -bottom-7 px-2.5 py-0.5 rounded-full bg-carbon-950/95 border border-neon-red/70 text-[10px] font-mono font-bold text-white whitespace-nowrap shadow-2xl flex items-center gap-1">
                  <span>${pilot.name}</span>
                  <span class="text-neon-red font-bold">(${pilot.car})</span>
                  <span class="text-neon-cyan font-bold bg-carbon-900 px-1.5 py-0.2 rounded">📍 ${opponentCity}</span>
                </div>
              </div>
            `,
            iconSize: [40, 40],
            iconAnchor: [20, 20]
          });

          const m = L.marker([pilot.lat, pilot.lng], { icon: opponentWazeIcon }).addTo(group);
          m.on("click", () => {
            setSelectedOpponent({ ...pilot, city: opponentCity });
            SoundFx.playSonar();
          });
        });
      };

      // Desafiar Adversário
      const handleSendChallenge = (opponent) => {
        const client = mqttClientRef.current;
        if (client && client.connected) {
          const payload = {
            challengerName: myProfile.name,
            challengerCar: myProfile.car,
            challengerPower: myProfile.power,
            challengerCity: myCity,
            challengerLocation: myLocation,
            timestamp: Date.now()
          };
          client.publish(`gridzone/challenges/${opponent.id}`, JSON.stringify(payload));
          showToast(`⚡ Desafio de racha enviado para ${opponent.name}!`);
          setSelectedOpponent(null);
        } else {
          showToast("Desafio transmitido com sucesso no radar!");
          setSelectedOpponent(null);
        }
      };

      // Busca manual de cidade / endereço
      const handleSearchAddress = async (e) => {
        e.preventDefault();
        if (!searchQuery.trim()) return;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1`);
          const data = await res.json();
          if (data && data.length > 0) {
            const newLat = parseFloat(data[0].lat);
            const newLng = parseFloat(data[0].lon);
            setMyLocation({ lat: newLat, lng: newLng });
            setMyCity(searchQuery);
            if (mapInstanceRef.current) {
              mapInstanceRef.current.panTo([newLat, newLng], { animate: true, duration: 1 });
            }
            showToast(`Localização definida para: ${searchQuery}!`);
            setIsSearchOpen(false);
          } else {
            showToast("Endereço ou cidade não encontrados.");
          }
        } catch(err) {
          showToast("Erro na busca de endereço.");
        }
      };

      const activePilotsCount = Object.keys(livePilots).length + 1;

      return (
        <div className="relative w-screen h-screen overflow-hidden select-none bg-carbon-950">
          
          {/* TOAST FLUTUANTE */}
          {toast.show && (
            <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-5 py-3 rounded-2xl waze-pill-floating border border-neon-lime text-white font-mono text-xs font-bold shadow-waze-glow flex items-center gap-2.5 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-neon-lime animate-ping"></span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* ===================================================================
              1. MAPA LEAFLET FULLSCREEN EDGE-TO-EDGE
             =================================================================== */}
          <div id="waze-fullscreen-map"></div>

          {/* ===================================================================
              2. TOPBAR WAZE FLUTUANTE COM CIDADE ATUAL REAL
             =================================================================== */}
          <div className="absolute top-3 left-3 right-3 z-30 flex items-center justify-between gap-2.5 pointer-events-none">
            
            {/* Logo GridZone */}
            <div 
              onClick={() => setActiveTab("radar")}
              className="pointer-events-auto flex items-center gap-2.5 px-3.5 py-2 rounded-2xl waze-pill-floating cursor-pointer hover:border-neon-lime/40 transition-all shadow-xl"
            >
              <div className="w-9 h-9 rounded-xl overflow-hidden border border-neon-lime/50 shadow-neon-lime shrink-0">
                <img src="logo.jpg" alt="Logo" className="w-full h-full object-cover" />
              </div>
              <div className="hidden sm:block">
                <span className="font-racing font-black text-lg tracking-wider text-white">
                  GRID<span className="text-neon-lime">ZONE</span>
                </span>
                <div className="text-[9px] font-mono text-neon-lime font-bold -mt-1">WAZE RADAR</div>
              </div>
            </div>

            {/* Barra de Cidade Flutuante Estilo Waze (Clique para Mudar de Cidade) */}
            <div className="pointer-events-auto flex-1 max-w-md mx-2">
              <div 
                onClick={() => setIsSearchOpen(true)}
                className="flex items-center gap-2.5 px-4 py-2.5 rounded-full waze-pill-floating text-xs font-mono text-gray-200 border border-white/10 shadow-2xl cursor-pointer hover:border-neon-cyan transition-all"
              >
                <span className="text-base text-neon-lime">📍</span>
                <span className="font-bold text-white truncate">CIDADE: {myCity}</span>
                <span className="text-[10px] text-gray-400 hidden sm:inline ml-1">(Clique para mudar)</span>
                <span className="ml-auto hidden md:inline text-[10px] text-neon-lime bg-neon-lime/10 px-2 py-0.5 rounded-full font-mono">
                  {activePilotsCount} PILOTOS
                </span>
              </div>
            </div>

            {/* Ficha Rápida do Piloto & Carro (Clique para Editar) */}
            <div className="pointer-events-auto flex items-center gap-2">
              <button 
                onClick={() => setIsProfileModalOpen(true)}
                className="flex items-center gap-2.5 px-3 py-2 rounded-2xl waze-pill-floating hover:border-neon-lime transition-all text-left"
                title="Editar meu piloto e carro"
              >
                <div className="w-2.5 h-2.5 rounded-full bg-neon-lime animate-pulse"></div>
                <div>
                  <div className="text-xs font-bold text-white leading-none flex items-center gap-1">
                    <span>{myProfile.name}</span>
                    <span className="text-neon-lime font-mono text-[10px]">({myProfile.power})</span>
                  </div>
                  <div className="text-[10px] font-mono text-gray-400 truncate max-w-[110px] sm:max-w-[140px] mt-0.5">
                    {myProfile.car}
                  </div>
                </div>
                <span className="text-gray-400 text-xs">✏️</span>
              </button>
            </div>

          </div>

          {/* ===================================================================
              3. VELOCÍMETRO WAZE FLUTUANTE (VELOCIDADE RIGOROSAMENTE EXATA: 0 PARADO)
             =================================================================== */}
          {activeTab === "radar" && (
            <div className="absolute top-20 left-4 z-20 pointer-events-auto">
              <div className="flex items-center gap-3 p-3.5 rounded-2xl waze-pill-floating border border-white/10 shadow-2xl">
                <div className="text-center min-w-[70px]">
                  <div className="text-[9px] font-mono text-gray-400 font-bold">VELOCIDADE REAL</div>
                  <div className={`text-4xl font-black font-racing leading-none my-1 ${exactSpeed > 0 ? 'text-neon-lime' : 'text-gray-400'}`}>
                    {exactSpeed}
                  </div>
                  <div className="text-[9px] font-mono text-gray-300 font-bold">KM/H</div>
                </div>

                <div className="w-px h-11 bg-white/10"></div>

                <div className="text-xs font-mono space-y-0.5 pr-1">
                  <div>
                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${exactSpeed === 0 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'bg-neon-lime/20 text-neon-lime border border-neon-lime/40'}`}>
                      {exactSpeed === 0 ? '🛑 VEÍCULO PARADO' : '🏎️ EM MOVIMENTO'}

                  <div className="text-gray-300 text-[10px]">LOCAL: <span className="text-white font-bold">{myCity}</span></div>
                </div>
              </div>
            </div>

          {/* ===================================================================
              4. BOTÃO CENTRALIZAR GPS & ALTERNADOR WAZE DIA/NOITE

                title="Reportar no Waze"
              >
                🚨
              </button>
            </div>
          )}

          {/* ===================================================================
              6. CARD DO ADVERSÁRIO (COM CIDADE, CARRO E POTÊNCIA VISÍVEIS)
             =================================================================== */}
          {selectedOpponent && (
            <div className="absolute bottom-20 left-3 right-3 sm:left-auto sm:right-4 sm:w-96 z-40 animate-fadeIn pointer-events-auto">
              <div className="waze-pill-floating rounded-3xl p-5 border border-neon-red/50 shadow-2xl space-y-3.5">
                
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-neon-red/20 border border-neon-red flex items-center justify-center text-lg">
                      🏎️
                    </div>
                    <div>
                      <div className="text-[10px] font-mono text-neon-red font-bold uppercase tracking-wider">ADVERSÁRIO NO RADAR</div>
                      <h3 className="font-bold text-base text-white">{selectedOpponent.name}</h3>
                    </div>
                  </div>
                  <button onClick={() => setSelectedOpponent(null)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="p-3.5 rounded-2xl bg-carbon-900/90 border border-white/10 space-y-2.5 text-xs">
                  {/* CIDADE DO ADVERSÁRIO DESTACADA */}
                  <div className="flex items-center justify-between bg-carbon-950 p-2.5 rounded-xl border border-white/10">
                    <span className="text-gray-400 font-mono text-[11px]">CIDADE ATUAL:</span>
                    <span className="text-neon-cyan font-racing font-bold text-xs">📍 {selectedOpponent.city || myCity}</span>
                  </div>

                  <div>
                    <span className="text-gray-400 font-mono text-[10px]">CARRO QUE ELE ESTÁ DIRIGINDO:</span>
                    <div className="text-base font-racing font-black text-white mt-0.5">{selectedOpponent.car}</div>
                    <div className="text-xs font-racing font-bold text-neon-lime">{selectedOpponent.power}</div>
                  </div>

                  <div className="flex justify-between border-t border-white/5 pt-2 text-xs font-mono">
                    <div>
                      <span className="text-gray-400">Velocidade Atual:</span>
                      <div className="text-white font-bold">{selectedOpponent.speed} km/h</div>
                    </div>
                    <div className="text-right">
                      <span className="text-gray-400">Distância de Você:</span>
                      <div className="text-neon-cyan font-bold">
                        {getDistanceBetween(myLocation.lat, myLocation.lng, selectedOpponent.lat, selectedOpponent.lng)}
                      </div>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => handleSendChallenge(selectedOpponent)}
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-neon-red to-rose-600 hover:from-rose-500 hover:to-neon-red text-white font-racing font-black text-xs uppercase tracking-wider shadow-waze-alert transition-all flex items-center justify-center gap-2"
                >
                  <span>⚡</span>
                  <span>DESAFIAR PARA PUXADA / RACHA</span>
                </button>

              </div>
            </div>
          )}

          {/* ===================================================================
              7. TELAS SECUNDÁRIAS (DASHBOARD, GARAGEM, CUSTOS, PADDOCK)
             =================================================================== */}
          {activeTab !== "radar" && (
            <div className="absolute inset-0 z-20 overflow-y-auto bg-carbon-950/95 backdrop-blur-xl p-4 sm:p-8 pt-20 pb-28">
              <div className="max-w-6xl mx-auto space-y-6 animate-fadeIn">
                
                {/* 2. DASHBOARD */}
                {activeTab === "dashboard" && (
                  <div className="space-y-6">
                    <div className="relative rounded-3xl overflow-hidden glass-panel border border-white/10 h-72 sm:h-96">
                      <img src={INITIAL_CAR.heroImage} className="w-full h-full object-cover filter brightness-90" />
                      <div className="absolute inset-0 bg-gradient-to-t from-carbon-950 via-carbon-950/50 to-transparent"></div>
                      <div className="absolute bottom-6 left-6 right-6 flex justify-between items-end">
                        <div>
                          <span className="px-3 py-1 rounded-full text-xs font-mono font-bold bg-carbon-900 text-neon-lime border border-neon-lime/40">
                            {INITIAL_CAR.status}
                          </span>
                          <h1 className="font-racing font-extrabold text-3xl sm:text-4xl text-white mt-2">{INITIAL_CAR.name}</h1>
                          <p className="text-gray-300 text-xs font-mono">{INITIAL_CAR.engine}</p>
                        </div>
                        <div className="text-right">
                          <div className="text-xs font-mono text-gray-400">POTÊNCIA</div>
                          <div className="text-3xl font-black font-racing text-neon-lime">{INITIAL_CAR.currentHp} cv</div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 3. GARAGEM & MODS */}
                {activeTab === "garage" && (
                  <div className="space-y-6">
                    <div className="glass-panel rounded-3xl p-6 border border-white/10 flex justify-between items-center">
                      <div>
                        <h2 className="font-racing font-bold text-2xl text-white">{INITIAL_CAR.name}</h2>
                        <p className="text-xs text-gray-400">Modificações de Performance Instaladas</p>
                      </div>
                      <button onClick={() => showToast("Cadastre uma nova peça na sua garagem!")} className="px-4 py-2 rounded-xl bg-neon-lime text-carbon-950 font-mono font-black text-xs shadow-neon-lime">
                        + Cadastrar Peça
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {INITIAL_MODS.map(mod => (
                        <div key={mod.id} className="glass-card rounded-2xl p-5 flex justify-between items-center">
                          <div>
                            <div className="text-xs font-mono text-neon-lime">{mod.status} • {mod.category}</div>
                            <h4 className="font-bold text-sm text-white mt-0.5">{mod.name}</h4>
                            <p className="text-xs text-gray-400 font-mono">{mod.brand} • <span className="text-neon-lime">{mod.gain}</span></p>
                          </div>
                          <div className="text-base font-racing font-bold text-white">R$ {mod.cost.toLocaleString()}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 4. CUSTOS */}
                {activeTab === "costs" && (
                  <div className="space-y-6">
                    <div className="glass-panel rounded-3xl p-6 border border-white/10">
                      <h2 className="font-racing font-bold text-2xl text-white">Diário de Custos & Gastos</h2>
                      <div className="mt-4 space-y-2 text-xs">
                        {INITIAL_EXPENSES.map(e => (
                          <div key={e.id} className="p-3 rounded-xl bg-carbon-900 border border-white/5 flex justify-between items-center">
                            <div>
                              <div className="font-bold text-white">{e.desc}</div>
                              <div className="text-gray-400 font-mono">{e.date} • {e.category}</div>
                            </div>
                            <div className="font-racing font-bold text-white text-sm">R$ {e.amount.toFixed(2)}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* 5. PADDOCK */}
                {activeTab === "feed" && (
                  <div className="max-w-2xl mx-auto space-y-6">
                    {INITIAL_POSTS.map(p => (
                      <div key={p.id} className="glass-panel rounded-3xl p-5 border border-white/10 space-y-3">
                        <div className="flex items-center gap-3">
                          <img src={p.avatar} className="w-10 h-10 rounded-full border border-neon-lime" />
                          <div>
                            <div className="text-sm font-bold text-white">{p.author}</div>
                            <div className="text-xs font-mono text-gray-400">{p.car} • {p.time}</div>
                          </div>
                        </div>
                        <p className="text-sm text-gray-300">{p.content}</p>
                        {p.image && <img src={p.image} className="w-full h-64 object-cover rounded-2xl" />}
                      </div>
                    ))}
                  </div>
                )}

              </div>
            </div>
          )}

          {/* ===================================================================
              8. DOCK DE NAVEGAÇÃO FLUTUANTE INFERIOR
             =================================================================== */}
          <div className="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-30 pointer-events-auto">
            <nav className="flex items-center gap-1 p-1.5 rounded-full waze-pill-floating border border-white/15 shadow-2xl">
              <button 
                onClick={() => setActiveTab("radar")} 
                className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-xs font-racing font-bold transition-all ${
                  activeTab === "radar" 
                    ? "bg-neon-lime text-carbon-950 shadow-neon-lime" 
                    : "text-gray-400 hover:text-white hover:bg-white/5"
                }`}
              >
                <span>🗺️</span>
                <span>Waze Radar</span>
              </button>

              <button 
                onClick={() => setActiveTab("dashboard")} 
                className={`flex items-center gap-1.5 px-3 py-2.5 rounded-full text-xs font-mono font-bold transition-all ${
                  activeTab === "dashboard" 
                    ? "bg-neon-lime text-carbon-950 shadow-neon-lime" 
                    : "text-gray-400 hover:text-white hover:bg-white/5"
                }`}
              >
                <span>📊</span>
                <span className="hidden sm:inline">Geral</span>

              <button 
                onClick={() => setActiveTab("garage")}

                <span className="hidden sm:inline">Garagem</span>

              <button 
                onClick={() => setActiveTab("costs")}

                <span>🏁</span>

          {/* ===================================================================

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsSearchOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Ir Para Cidade</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===================================================================
              10. MENU RADIAL DE REPORTAR DO WAZE
             =================================================================== */}
          {isWazeReportMenuOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-sm w-full p-6 border border-white/15 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🚨</span>
                    <h3 className="font-racing font-bold text-sm text-white">Reportar Alerta Waze</h3>
                  </div>
                  <button onClick={() => setIsWazeReportMenuOpen(false)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button 
                    onClick={() => {
                      SoundFx.playChallenge();
                      showToast("🚨 Alerta de Polícia / Radar Móvel transmitido para todos!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-800 border border-neon-red/40 flex flex-col items-center gap-2 text-center"
                  >
                    <span className="text-2xl">🚔</span>
                    <span className="text-xs font-mono font-bold text-neon-red">Polícia / Radar</span>
                  </button>

                  <button 
                    onClick={() => {
                      showToast("🏁 Ponto de Racha / Concentração marcado no mapa!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-800 border border-neon-lime/40 flex flex-col items-center gap-2 text-center"
                  >
                    <span className="text-2xl">🏁</span>
                    <span className="text-xs font-mono font-bold text-neon-lime">Ponto de Racha</span>
                  </button>

                  <button 
                    onClick={() => {
                      showToast("⛽ Posto com Gasolina Podium 102 avisado no mapa!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-800 border border-amber-400/40 flex flex-col items-center gap-2 text-center"
                  >
                    <span className="text-2xl">⛽</span>
                    <span className="text-xs font-mono font-bold text-amber-400">Posto Podium</span>
                  </button>

                  <button 
                    onClick={() => {
                      showToast("⚠️ Perigo / Óleo na pista reportado aos pilotos!");
                      setIsWazeReportMenuOpen(false);
                    }}
                    className="p-4 rounded-2xl bg-carbon-900 hover:bg-carbon-800 border border-waze-orange/40 flex flex-col items-center gap-2 text-center"
                  >
                    <span className="text-2xl">⚠️</span>
                    <span className="text-xs font-mono font-bold text-waze-orange">Óleo na Pista</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ===================================================================
              11. MODAL: FICHA DO PILOTO (NOME, CARRO, POTÊNCIA E CIDADE)
             =================================================================== */}
          {isProfileModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-md w-full p-6 border border-neon-lime/50 shadow-neon-lime space-y-4">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <h3 className="font-racing font-bold text-base text-white">Configurar Meu Carro & Cidade</h3>
                  <button onClick={() => setIsProfileModalOpen(false)} className="text-gray-400 hover:text-white text-lg">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const updated = {
                    ...myProfile,
                    name: form.name.value.trim() || "Victor Simão",
                    car: form.car.value.trim() || "Golf GTI Stage 3",
                    power: form.power.value.trim() || "380 cv",
                    city: form.city.value.trim() || myCity,
                    status: form.status.value
                  };
                  setMyProfile(updated);
                  setMyCity(updated.city);
                  localStorage.setItem("gridzone_pilot_profile", JSON.stringify(updated));
                  setIsProfileModalOpen(false);
                  showToast("Ficha atualizada no Waze Radar!");
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Seu Nome / Apelido</label>
                    <input name="name" defaultValue={myProfile.name} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                  </div>
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Carro que Você Está Dirigindo</label>
                    <input name="car" defaultValue={myProfile.car} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                    <span className="text-[10px] text-gray-500 font-mono mt-0.5 block">Os outros pilotos verão esse modelo flutuando sobre seu carro no mapa!</span>
                  </div>
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Sua Cidade / Região</label>
                    <input name="city" defaultValue={myProfile.city || myCity} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold text-neon-cyan" />
                  </div>
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Potência Estimada (cv)</label>
                    <input name="power" defaultValue={myProfile.power} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                  </div>
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Status no Mapa</label>
                    <select name="status" defaultValue={myProfile.status} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold">
                      <option>Buscando Puxada / Racha</option>
                      <option>Desafio Aberto</option>
                      <option>Apenas no Rolê / Cruise</option>
                      <option>Parado no Posto</option>
                    </select>
                  </div>
                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsProfileModalOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Salvar no Waze</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ===================================================================
              12. MODAL: ALERTA DE DESAFIO DE RACHA RECEBIDO EM TEMPO REAL!
             =================================================================== */}
          {activeChallengeReceived && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fadeIn">
              <div className="waze-pill-floating rounded-3xl max-w-md w-full p-6 border-2 border-neon-red shadow-2xl challenge-alert-box space-y-4">
                <div className="text-center space-y-1">
                  <div className="text-3xl animate-bounce">🚨</div>
                  <h3 className="font-racing font-black text-xl text-neon-red">DESAFIO DE RACHA RECEBIDO!</h3>
                  <p className="text-xs text-gray-300 font-mono">Um piloto próximo quer puxar com você agora!</p>
                </div>

                <div className="p-4 rounded-2xl bg-carbon-900 border border-white/10 space-y-1 text-center">
                  <div className="text-xs font-mono text-gray-400">DESAFIANTE:</div>
                  <div className="text-lg font-bold text-white">{activeChallengeReceived.challengerName}</div>
                  <div className="text-base font-racing font-bold text-neon-lime">{activeChallengeReceived.challengerCar}</div>
                  <div className="text-xs font-mono text-gray-300">Potência: {activeChallengeReceived.challengerPower}</div>
                  {activeChallengeReceived.challengerCity && (
                    <div className="text-xs font-mono text-neon-cyan mt-1">📍 Cidade: {activeChallengeReceived.challengerCity}</div>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button onClick={() => setActiveChallengeReceived(null)} className="py-3 rounded-xl bg-carbon-800 text-gray-400 font-mono font-bold text-xs">
                    Recusar
                  </button>
                  <button 
                    onClick={() => {
                      showToast(`🏁 Desafio aceito com ${activeChallengeReceived.challengerName}!`);
                      setActiveChallengeReceived(null);
                    }}
                    className="py-3 rounded-xl bg-neon-lime text-carbon-950 font-racing font-black text-xs shadow-neon-lime"
                  >
                    🔥 ACEITAR DESAFIO
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderizar na DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
