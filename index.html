  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // CÁLCULO DE DISTÂNCIA REAL HAVERSINE
    // =========================================================================
    function getDistanceBetween(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return "Calculando...";
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const distKm = R * c;
      if (distKm < 1) {
        return `${Math.round(distKm * 1000)} metros`;
      }
      return `${distKm.toFixed(1)} km`;
    }

    // =========================================================================
    // EFEITOS SONOROS WEBAUDIO
    // =========================================================================
    const SoundFx = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playSonar() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      },
      playChallenge() {
        if (this.muted) return;
        try {
          this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.2);
          osc.frequency.linearRampToValueAtTime(440, this.ctx.currentTime + 0.4);
          osc.frequency.linearRampToValueAtTime(880, this.ctx.currentTime + 0.6);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.8);
        } catch(e) {}
      }
    };

    // =========================================================================
    // DADOS INICIAIS DA GARAGEM, MODS, CUSTOS & FEED (INTEGRAÇÃO TOTAL)
    // =========================================================================
    const INITIAL_CAR = {
      name: "BMW M2 Coupe (G87)",
      year: 2023,

      stockHp: 460,
      currentHp: 560,
      stockTorque: 550,
      currentTorque: 680,
      weight: "1.700 kg",
      powerToWeight: "3.03 kg/cv",
      currentKm: 24850,
      status: "Pista & Rua (Stage 2)",
      zeroToHundred: "3.4 s",
      heroImage: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=1200&q=80"
    };

    const INITIAL_MODS = [
      { id: 1, name: "Downpipe Inox 304 High-Flow 200 Células", brand: "VRSF", category: "Escape", cost: 4800, gain: "+20 cv", status: "Instalado" },
      { id: 2, name: "Intake de Fibra de Carbono Selado", brand: "Eventuri", category: "Admissão", cost: 12500, gain: "+15 cv", status: "Instalado" },
      { id: 3, name: "Remap Bootmod3 Stage 2 Custom E30", brand: "Bootmod3", category: "Injeção", cost: 6500, gain: "+75 cv", status: "Instalado" },
      { id: 4, name: "Coilovers Reguláveis KW V3 Clubsport", brand: "KW Suspensions", category: "Suspensão", cost: 18900, gain: "Setup Pista", status: "Instalado" },
      { id: 5, name: "Escapamento Cat-Back c/ Válvulas", brand: "Milltek Sport", category: "Escape", cost: 14200, gain: "+10 cv / Ronco", status: "Instalado" },
      { id: 6, name: "Rodas Forjadas BBS FI-R 19\"/20\"", brand: "BBS Motorsport", category: "Rodas", cost: 32000, gain: "-12kg não-suspensa", status: "Lista de Desejos" }
    ];

    const INITIAL_EXPENSES = [
      { id: 1, desc: "Gasolina Podium Petrobras (55 Litros)", category: "Combustível", amount: 489.50, date: "28/10/2026", km: 24850 },
      { id: 2, desc: "Troca de Óleo Motul 300V 5W-40 + Filtro M", category: "Manutenção", amount: 1250.00, date: "12/10/2026", km: 24200 },
      { id: 3, desc: "Downpipe VRSF Inox 304", category: "Peças & Mods", amount: 4800.00, date: "02/06/2026", km: 20400 },
      { id: 4, desc: "Parcela Seguro Auto Porto Seguro M", category: "Seguro & Taxas", amount: 1120.00, date: "05/10/2026", km: 23900 },
      { id: 5, desc: "Lavagem Detalhada & Proteção Cerâmica", category: "Estética", amount: 550.00, date: "19/10/2026", km: 24500 }
    ];

    const INITIAL_POSTS = [
      {
        id: 1,
        author: "Renato 'Boost' M.",
        car: "BMW M2 G87 Stage 2 (560cv)",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80",
        time: "há 2 horas",
        content: "Track Day inesquecível no Autódromo Velocitta! O setup KW V3 segurou perfeitamente as curvas de alta. Baixei 1.4s no meu tempo de volta! 🏁⏱️",
        image: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=900&q=80",
        likes: 54,
        isLiked: false,
        comments: [
          { author: "Guilherme (RS3)", text: "Ficou monstro o acerto de suspensão! Parabéns!" }
        ]
      },
      {
        id: 2,
        author: "Marcos K-Tuned",
        car: "Civic Si K24 Turbo (430cv)",
        avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80",
        time: "há 5 horas",
        content: "Passada no dinamômetro finalizada: 430whp com 1.3 bar de pressão no Etanol puro. Turbina Garrett G25 enchendo muito rápido! 📈💨",
        image: "https://images.unsplash.com/photo-1606016159991-dfe4f2746ad5?auto=format&fit=crop&w=900&q=80",
        likes: 89,
        isLiked: true,
        comments: []
      }
    ];

    // =========================================================================
    // COMPONENTE PRINCIPAL
    // =========================================================================
    function App() {
      // Navegação por Abas: 'radar' (Waze), 'dashboard', 'garage', 'costs', 'feed'
      const [activeTab, setActiveTab] = useState("radar");

      // Perfil do Piloto
      const [myProfile, setMyProfile] = useState(() => {
        const saved = localStorage.getItem("gridzone_pilot_profile");
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return {
          id: "pilot_" + Math.random().toString(36).substring(2, 8),
          name: "Piloto-" + Math.floor(Math.random() * 899 + 100),
          car: "BMW M2 Coupe (G87)",
          power: "560 cv",
          status: "Buscando Puxada / Racha"
        };
      });

      // Localização GPS
      const [myLocation, setMyLocation] = useState({ lat: -23.5505, lng: -46.6333 });
      const [mySpeed, setMySpeed] = useState(0);
      const [gpsHeading, setGpsHeading] = useState(135);
      const [hasRealGps, setHasRealGps] = useState(false);

      // Pilotos em Tempo Real
      const [livePilots, setLivePilots] = useState({
        "bot-1": { id: "bot-1", name: "Guilherme 'Apex'", car: "Audi RS3 DaZa 2.5T", power: "620 cv", lat: -23.5470, lng: -46.6390, speed: 84, status: "Pronto pra Puxada" },
        "bot-2": { id: "bot-2", name: "Diego K-Tuned", car: "Civic Si K24 Turbo", power: "430 cv", lat: -23.5560, lng: -46.6270, speed: 62, status: "Buscando Racha" },
        "bot-3": { id: "bot-3", name: "Thiago Track", car: "Golf R Mk8 Stage 3", power: "480 cv", lat: -23.5420, lng: -46.6310, speed: 0, status: "Parado no Posto" }
      });

      // Modais
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [selectedOpponent, setSelectedOpponent] = useState(null);
      const [activeChallengeReceived, setActiveChallengeReceived] = useState(null);
      const [isCreateSpotOpen, setIsCreateSpotOpen] = useState(false);
      const [isAddAlertOpen, setIsAddAlertOpen] = useState(false);
      const [isAddModOpen, setIsAddModOpen] = useState(false);
      const [isAddExpenseOpen, setIsAddExpenseOpen] = useState(false);

      // Dados de Mods, Custos e Posts
      const [modsList, setModsList] = useState(INITIAL_MODS);
      const [expensesList, setExpensesList] = useState(INITIAL_EXPENSES);
      const [postsList, setPostsList] = useState(INITIAL_POSTS);

      // Toast
      const [toast, setToast] = useState({ show: false, msg: "" });
      const showToast = (msg) => {
        setToast({ show: true, msg });
        SoundFx.playSonar();
        setTimeout(() => setToast({ show: false, msg: "" }), 3500);
      };

      // Referência do Mapa
      const mapInstanceRef = useRef(null);
      const markersGroupRef = useRef(null);
      const mqttClientRef = useRef(null);

      // -----------------------------------------------------------------------
      // 1. INICIALIZAR GEOLOCALIZAÇÃO
      // -----------------------------------------------------------------------
      useEffect(() => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude, speed } = pos.coords;
              setMyLocation({ lat: latitude, lng: longitude });
              setMySpeed(speed ? Math.round(speed * 3.6) : 48);
              setHasRealGps(true);
            },
            () => setHasRealGps(false),
            { enableHighAccuracy: true }
          );

          const watchId = navigator.geolocation.watchPosition(
            (pos) => {
              const { latitude, longitude, speed, heading } = pos.coords;
              setMyLocation({ lat: latitude, lng: longitude });
              setMySpeed(speed ? Math.round(speed * 3.6) : Math.floor(Math.random() * 20 + 55));
              if (heading) setGpsHeading(Math.round(heading));
              setHasRealGps(true);
            },
            () => setHasRealGps(false),
            { enableHighAccuracy: true, maximumAge: 2500 }
          );

          return () => navigator.geolocation.clearWatch(watchId);
        }
      }, []);

      // -----------------------------------------------------------------------
      // 2. CONEXÃO MQTT REALTIME (MULTIPLAYER SEM CAIR)
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (typeof mqtt !== "undefined" && mqtt.connect) {
          try {
            const client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
              clientId: "gz_" + myProfile.id,
              clean: true,
              reconnectPeriod: 4000,
              connectTimeout: 8000
            });
            mqttClientRef.current = client;

            client.on("connect", () => {
              client.subscribe("gridzone/pilots/#");
              client.subscribe(`gridzone/challenges/${myProfile.id}`);
            });

            client.on("message", (topic, message) => {
              try {
                const data = JSON.parse(message.toString());
                if (topic.startsWith("gridzone/pilots/")) {
                  const pilotId = topic.replace("gridzone/pilots/", "");
                  if (pilotId !== myProfile.id) {
                    setLivePilots(prev => ({
                      ...prev,
                      [pilotId]: { ...data, lastSeen: Date.now() }
                    }));
                  }
                }
                if (topic === `gridzone/challenges/${myProfile.id}`) {
                  setActiveChallengeReceived(data);
                  SoundFx.playChallenge();
                  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
                }
              } catch(e) {}
            });
          } catch(e) {}
        }

        return () => {
          if (mqttClientRef.current) {
            try { mqttClientRef.current.end(); } catch(e) {}
          }
        };
      }, [myProfile.id]);

      // Broadcast da posição para os adversários a cada 3.5s
      useEffect(() => {
        const sendUpdate = () => {
          const client = mqttClientRef.current;
          if (client && client.connected) {
            const payload = {
              id: myProfile.id,
              name: myProfile.name,
              car: myProfile.car,
              power: myProfile.power,
              status: myProfile.status,
              lat: myLocation.lat,
              lng: myLocation.lng,
              speed: mySpeed,
              heading: gpsHeading,
              timestamp: Date.now()
            };
            client.publish(`gridzone/pilots/${myProfile.id}`, JSON.stringify(payload));
          }
        };

        sendUpdate();
        const interval = setInterval(sendUpdate, 3500);
        return () => clearInterval(interval);
      }, [myLocation, mySpeed, gpsHeading, myProfile]);

      // -----------------------------------------------------------------------
      // 3. INICIALIZAR E ATUALIZAR O MAPA LEAFLET COM SEGURANÇA 100%
      // -----------------------------------------------------------------------
      useEffect(() => {
        if (activeTab !== "radar") return;

        let map = mapInstanceRef.current;
        const container = document.getElementById("radar-map");
        if (!container) return;

        // Limpa se o container já possuía instância antiga
        if (container._leaflet_id && !map) {
          container._leaflet_id = null;
        }

        if (!map) {
          try {
            map = L.map("radar-map", {
              center: [myLocation.lat, myLocation.lng],
              zoom: 14,
              zoomControl: false,
              attributionControl: false
            });

            // Camada Noturna CartoDB Dark Matter
            L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
              maxZoom: 19,
              subdomains: "abcd"
            }).addTo(map);

            L.control.zoom({ position: "bottomright" }).addTo(map);
            markersGroupRef.current = L.layerGroup().addTo(map);
            mapInstanceRef.current = map;
          } catch(err) {
            console.warn("Erro ao iniciar Leaflet:", err);
          }
        }

        // Garante redimensionamento sem cortes ou cinza
        const timer1 = setTimeout(() => {
          if (mapInstanceRef.current) mapInstanceRef.current.invalidateSize();
        }, 100);
        const timer2 = setTimeout(() => {
          if (mapInstanceRef.current) mapInstanceRef.current.invalidateSize();
        }, 350);

        updateMapMarkers();

        return () => {
          clearTimeout(timer1);
          clearTimeout(timer2);
        };
      }, [activeTab]);

      // Atualiza marcadores quando a posição ou pilotos mudam
      useEffect(() => {
        if (activeTab === "radar" && mapInstanceRef.current) {
          updateMapMarkers();
        }
      }, [myLocation, livePilots, mySpeed, myProfile, activeTab]);

      const updateMapMarkers = () => {
        const map = mapInstanceRef.current;
        const group = markersGroupRef.current;
        if (!map || !group) return;

        group.clearLayers();

        // 1. Marcador do Seu Veículo (Verde Neon)
        const myIcon = L.divIcon({
          className: "my-marker",
          html: `
            <div class="relative flex items-center justify-center">
              <div class="w-14 h-14 bg-neon-lime/25 rounded-full pilot-pulse-marker absolute"></div>
              <div class="w-9 h-9 bg-carbon-950 border-2 border-neon-lime rounded-full flex items-center justify-center shadow-neon-lime z-10 text-white font-black text-xs">
                🏎️
              </div>
              <div class="absolute -bottom-6 px-2 py-0.5 rounded bg-carbon-900 border border-neon-lime text-[10px] font-mono font-bold text-neon-lime whitespace-nowrap shadow-lg">
                ${myProfile.name} • ${myProfile.car}
              </div>
            </div>
          `,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        L.marker([myLocation.lat, myLocation.lng], { icon: myIcon }).addTo(group);

        // 2. Marcadores dos Adversários Conectados
        Object.values(livePilots).forEach(pilot => {
          const opponentIcon = L.divIcon({

                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Seu Nome / Apelido</label>
                    <input name="name" defaultValue={myProfile.name} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                  </div>
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Carro que Você Está Dirigindo</label>
                    <input name="car" defaultValue={myProfile.car} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                  </div>
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Potência Estimada (cv)</label>
                    <input name="power" defaultValue={myProfile.power} required className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                  </div>
                  <div>
                    <label className="text-gray-300 font-mono block mb-1">Status no Mapa</label>
                    <select name="status" defaultValue={myProfile.status} className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold">
                      <option>Buscando Puxada / Racha</option>
                      <option>Desafio Aberto</option>
                      <option>Apenas no Rolê / Cruise</option>
                      <option>Parado no Posto</option>
                    </select>
                  </div>
                  <div className="pt-2 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setIsProfileModalOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-lime text-carbon-950 font-black font-racing shadow-neon-lime">Salvar no Radar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: ADVERSÁRIO CLICADO NO MAPA */}
          {selectedOpponent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-neon-red/50 shadow-neon-red space-y-4">
                <div className="flex justify-between items-center border-b border-white/10 pb-3">
                  <div>
                    <h3 className="font-racing font-bold text-lg text-white">Adversário no Radar</h3>
                    <p className="text-[11px] text-neon-red font-mono font-bold">VEJA QUEM VOCÊ VAI ENFRENTAR</p>
                  </div>
                  <button onClick={() => setSelectedOpponent(null)} className="text-gray-400 hover:text-white text-xl">✕</button>
                </div>

                <div className="p-4 rounded-2xl bg-carbon-900 border border-white/10 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <div className="text-[10px] font-mono text-gray-400">PILOTO</div>
                      <div className="text-lg font-bold text-white">{selectedOpponent.name}</div>
                    </div>
                    <span className="px-2.5 py-1 rounded-full text-[10px] font-mono font-bold bg-neon-red/20 text-neon-red border border-neon-red/40">
                      {selectedOpponent.status}
                    </span>
                  </div>

                  <div className="border-t border-white/5 pt-2.5">
                    <div className="text-[10px] font-mono text-gray-400">CARRO & PREPARAÇÃO</div>
                    <div className="text-base font-racing font-black text-white">{selectedOpponent.car}</div>
                    <div className="text-sm font-racing font-bold text-neon-lime">{selectedOpponent.power}</div>
                  </div>

                  <div className="border-t border-white/5 pt-2.5 flex justify-between text-xs font-mono">
                    <div>
                      <span className="text-gray-400">Velocidade Atual:</span>
                      <div className="font-bold text-white">{selectedOpponent.speed} km/h</div>
                    </div>
                    <div className="text-right">
                      <span className="text-gray-400">Distância:</span>
                      <div className="font-bold text-neon-cyan">
                        {getDistanceBetween(myLocation.lat, myLocation.lng, selectedOpponent.lat, selectedOpponent.lng)}
                      </div>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => handleChallenge(selectedOpponent)}
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-neon-red to-rose-600 text-white font-racing font-black text-xs uppercase tracking-wider shadow-neon-red transition-all flex items-center justify-center gap-2"
                >
                  <span>⚡</span>
                  <span>DESAFIAR PARA PUXADA / RACHA</span>
                </button>
              </div>
            </div>
          )}

          {/* MODAL 3: DESAFIO RECEBIDO */}
          {activeChallengeReceived && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md animate-fadeIn">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border-2 border-neon-red shadow-2xl challenge-alert-box space-y-4">
                <div className="text-center space-y-1">
                  <div className="text-3xl animate-bounce">🚨</div>
                  <h3 className="font-racing font-black text-xl text-neon-red">DESAFIO DE RACHA RECEBIDO!</h3>
                  <p className="text-xs text-gray-300 font-mono">Um piloto próximo quer puxar com você agora!</p>
                </div>

                <div className="p-4 rounded-2xl bg-carbon-900 border border-white/10 space-y-2 text-center">
                  <div className="text-xs font-mono text-gray-400">DESAFIANTE:</div>
                  <div className="text-lg font-bold text-white">{activeChallengeReceived.challengerName}</div>
                  <div className="text-base font-racing font-bold text-neon-lime">{activeChallengeReceived.challengerCar}</div>
                  <div className="text-xs font-mono text-gray-300">Potência: {activeChallengeReceived.challengerPower}</div>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button onClick={() => setActiveChallengeReceived(null)} className="py-3 rounded-xl bg-carbon-800 text-gray-400 font-mono font-bold text-xs">
                    Recusar
                  </button>
                  <button 
                    onClick={() => {
                      showToast(`🏁 Desafio aceito com ${activeChallengeReceived.challengerName}!`);
                      setActiveChallengeReceived(null);
                    }}
                    className="py-3 rounded-xl bg-neon-lime text-carbon-950 font-racing font-black text-xs shadow-neon-lime"
                  >
                    🔥 ACEITAR DESAFIO
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: MARCAR PONTO */}
          {isCreateSpotOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-neon-lime/40 shadow-neon-lime space-y-4">
                <h3 className="font-racing font-bold text-lg text-white">Marcar Ponto de Racha / Encontro</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast("Ponto de racha marcado e compartilhado no radar!");
                  setIsCreateSpotOpen(false);
                }} className="space-y-3 text-xs">
                  <input name="title" required placeholder="Ex: Reta do Aeroporto, Posto Shell Podium" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsCreateSpotOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-lime text-carbon-950 font-black">Marcar no Mapa</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 5: AVISAR POLÍCIA */}
          {isAddAlertOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="glass-modal rounded-3xl max-w-md w-full p-6 border border-neon-red/40 shadow-neon-red space-y-4">
                <h3 className="font-racing font-bold text-lg text-white">Alertar Radar Móvel / Polícia</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  SoundFx.playChallenge();
                  showToast("Alerta emitido para os pilotos próximos!");
                  setIsAddAlertOpen(false);
                }} className="space-y-3 text-xs">
                  <input name="title" required placeholder="Ex: Viatura com radar móvel sob viaduto" className="w-full bg-carbon-900 border border-white/10 rounded-xl px-3.5 py-2 text-white font-bold" />
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setIsAddAlertOpen(false)} className="px-4 py-2 rounded-xl bg-carbon-800 text-gray-300">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-neon-red text-white font-black">Emitir Alerta</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Renderizar na DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
